<!DOCTYPE html>

  <title>Metodologie Didattiche Attive & Prompt IA — Guida Editoriale Interattiva</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Playfair Display, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Palette Editoriale (Contrasto AAA verificato) */
      --ink: #1C1C1C;          /* Testo principale */
      --cream: #FAF6EE;        /* Sfondo generale caldo */
      --paper: #F2EAD9;        /* Sezioni alternate */
      --surface: #FFFFFF;      /* Superfici neutre per card */
      --primary: #5C182B;      /* Borgogna profondo tematico */
      --primary-dark: #3D0F1C; /* Variante attiva */
      --accent: #7A4D05;       /* Accento oro rame */
      
      /* Palette Semantica di Stato (Fissa AAA) */
      --status-progress: #0047AB; /* ⏳ In corso - Blu Cobalto */
      --status-warning: #B0004A;  /* ⚠️ Attenzione - Fucsia Intenso */
      --status-success: #005C36;  /* ✅ Completato - Verde Smeraldo */
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      line-height: 1.6;
    }

    .font-serif-display {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Focus Visibile Accessibile */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 3px solid var(--status-progress) !important;
      outline-offset: 3px !important;
      border-radius: 4px;
    }

    /* Supporto Movimento Ridotto */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--paper); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

    mark {
      background-color: #FDE047;
      color: #1C1C1C;
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 600;
    }

    .paper-texture {
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 0, 0, 0.015) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 0, 0, 0.015) 0%, transparent 40%);
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.625rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-width: 1px;
    }

    .badge-progress {
      background-color: #EFF6FF;
      color: var(--status-progress);
      border-color: #BFDBFE;
    }

    .badge-warning {
      background-color: #FFF1F2;
      color: var(--status-warning);
      border-color: #FECDD3;
    }

    .badge-success {
      background-color: #ECFDF5;
      color: var(--status-success);
      border-color: #A7F3D0;
    }
  </style>
</head>

  <script>
    const glossaryTerms = [
      { term: '5E Model', category: 'Inquiry-Based Learning', def: 'Modello didattico investigativo articolato in 5 fasi sequenziali: Engage (Coinvolgi), Explore (Esplora), Explain (Spiega), Elaborate (Elabora) ed Evaluate (Valuta).' },
      { term: 'ARES (Modello)', category: 'Debate & Argomentazione', def: 'Struttura d\'argomentazione per il Debate: Asserzione (la tesi), Ragionamento (il perché logico), Evidenza (dati e fonti empiriche) e Svolta/Link (connessione al tema generale).' },
      { term: 'Autoefficacia', category: 'Psicologia dell\'Apprendimento', def: 'Concezione della propria capacità di organizzare ed eseguire le azioni necessarie per produrre determinati risultati (Albert Bandura), potenziata dall\'apprendimento tra pari e dal feedback formativo.' },
      { term: 'Case Study', category: 'Decision-Making', def: 'Analisi guidata di una situazione reale o verosimile complessa (legale, etica, economica) che richiede agli studenti di prendere e motivare decisioni strategiche.' },
      { term: 'Conceptest', category: 'Peer Instruction', def: 'Quesito concettuale a scelta multipla con distruttori basati sulle misconcezioni comuni degli studenti, usato per innescare il confronto in diade nella Peer Instruction.' },
      { term: 'Cooperative Learning', category: 'Apprendimento Collaborativo', def: 'Insieme di tecniche didattiche in cui gli studenti lavorano in piccoli gruppi eterogenei per raggiungere obiettivi comuni, responsabili sia del proprio apprendimento che di quello dei compagni.' },
      { term: 'Debate (Dibattito Regolamentato)', category: 'Debate & Argomentazione', def: 'Metodologia formale in cui due squadre sostengono e confutano una mozione controversa (pro vs contro) rispettando tempi prefissati e regole strutturate di discussione.' },
      { term: 'Debriefing', category: 'Didattica Esperienziale', def: 'Fase di rielaborazione critica e meta-cognitiva che segue una simulazione, un role playing o un laboratorio, per far emergere le dinamiche relazionali ed emotive vissute.' },
      { term: 'Design Thinking', category: 'Progettazione Creativa', def: 'Metodologia di risoluzione di problemi articolata in 5 fasi (Empatizza, Definisci, Idea, Prototipa, Testa) incentrata sulle reali esigenze dell\'utente finale.' },
      { term: 'Driving Question', category: 'Project-Based Learning', def: 'Domanda guida sfidante, aperta e motivante che dà avvio a un percorso di Project-Based Learning (PjBL) orientando la realizzazione dell\'artefatto.' },
      { term: 'Elevator Pitch', category: 'Comunicazione & Presentation', def: 'Presentazione d\'impatto della durata estremamente sintetica (1-3 minuti) usata per esporre la soluzione a un problema o un progetto davanti a una giuria.' },
      { term: 'Eric Mazur (Metodo)', category: 'Peer Learning', def: 'Fisico e pedagogista di Harvard ideatore della Peer Instruction negli anni \'90, basata sul ciclo: spiegazione breve ➔ Conceptest ➔ voto individuale ➔ discussione in coppia con un compagno con risposta diversa ➔ rivotazione.' },
      { term: 'Flipped Classroom', category: 'Didattica Invertita', def: 'Inversione dei tradizionali momenti didattici: lo studio teorico dei contenuti di base avviene in autonomia a casa, mentre il tempo in classe è dedicato all\'applicazione pratica e alla rielaborazione.' },
      { term: 'Hackathon', category: 'Progettazione Creativa', def: 'Maratona intensiva di co-progettazione a squadre in cui gli studenti sviluppano soluzioni e prototipi a una sfida complessa in un arco di tempo ristretto.' },
      { term: 'Ill-Structured Problem', category: 'Problem-Based Learning', def: 'Problema complesso, aperto e privo di una soluzione unica o preconfezionata, formulato per stimolare l\'indagine e la formulazione autonoma di ipotesi (PBL).' },
      { term: 'Interdipendenza Positiva', category: 'Cooperative Learning', def: 'Principio cardine del Cooperative Learning secondo cui il successo del singolo studente dipende dal successo dell\'intero gruppo e viceversa ("uno per tutti, tutti per uno").' },
      { term: 'Jigsaw', category: 'Cooperative Learning', def: 'Tecnica di Cooperative Learning in cui gli studenti si dividono in "Gruppi Base" e "Gruppi Esperti": ciascuno approfondisce una parte dell\'argomento per poi insegnarla ai propri compagni.' },
      { term: 'Metacognizione', category: 'Psicologia dell\'Apprendimento', def: 'Consapevolezza e controllo dei propri processi cognitivi di apprendimento; capacità di riflettere sulle strategie mentali utilizzate per comprendere, memorizzare e risolvere problemi.' },
      { term: 'Outdoor Education', category: 'Didattica Esperienziale', def: 'Insieme di pratiche educative svolte all\'aperto e sul territorio che valorizzano la relazione diretta con l\'ambiente naturale e antropico come luogo privilegiato d\'apprendimento.' },
      { term: 'Peer Instruction', category: 'Peer Learning', def: 'Metodo sviluppato da Eric Mazur che alterna quesiti concettuali (Conceptest), votazione individuale, discussione tra pari in coppia e spiegazione chiarificatrice del docente.' },
      { term: 'Peer Tutoring', category: 'Peer Learning', def: 'Pratica didattica in cui uno studente ("tutor") affianca un compagno ("tutee") per aiutarlo nell\'acquisizione di abilità, concetti o metodologie di studio.' },
      { term: 'POI (Point of Information)', category: 'Debate & Argomentazione', def: 'Interruzione formale breve (massimo 15 secondi) concessa durante un discorso nel Debate per porre una domanda o una rapida obiezione all\'oratore avversario.' },
      { term: 'Public Speaking', category: 'Competenze Trasversali', def: 'Capacità di parlare in pubblico in modo chiaro, persuasivo e strutturato, gestendo linguaggio verbale, paraverbale (tono, ritmo) e non verbale (postura, sguardo).' },
      { term: 'Role Playing', category: 'Simulazione', def: 'Tecnica drammaturgica e simulativa in cui i partecipanti assumono ruoli e comportamenti specifici in uno scenario fittizio per comprendere dinamiche interpersonali o sociali.' },
      { term: 'Rubrica Analitica', category: 'Valutazione', def: 'Strumento di valutazione delle competenze composto da dimensioni d\'apprendimento, criteri, indicatori osservabili e descrittori di livello (es. Iniziale, Base, Intermedio, Avanzato).' },
      { term: 'Scaffolding', category: 'Psicologia dell\'Apprendimento', def: 'Insieme di sostegni e aiuti temporanei forniti dal docente (o da un pari più esperto) per consentire allo studente di svolgere un compito che supererebbe le sue sole forze attuali (Zona di Sviluppo Prossimale di Lev Vygotskij).' },
      { term: 'Service Learning', category: 'Educazione Civica', def: 'Integrazione del curricolo scolastico con attività di servizio e volontariato concreto per rispondere a bisogni reali della comunità e del territorio locale.' },
      { term: 'Soft Skills / Competenze Trasversali', category: 'Competenze', def: 'Insieme di abilità non strettamente legate a una singola materia (es. problem solving, comunicazione, lavoro di squadra, pensiero critico, adattabilità) fondamentali nel mondo scolastico e professionale.' },
      { term: 'TEAL (Technology Enhanced Active Learning)', category: 'Spazi Innovativi', def: 'Ambiente di apprendimento integrato che unisce tecnologie digitali, arredi modulari e riconfigurabili e metodologie attive di collaborazione a gruppi.' },
      { term: 'Tinkering / Making', category: 'Didattica Esperienziale', def: 'Apprendimento pratico "hands-on" incentrato sul fare, la manipolazione di materiali e circuiti, la prototipazione rapida e la valorizzazione dell\'errore come tappa del processo.' },
      { term: 'Toulmin (Schema di)', category: 'Debate & Argomentazione', def: 'Modello di analisi e costruzione delle argomentazioni basato su Dati (Data), Tesi (Claim), Garanzia (Warrant), Sostegno (Backing), Qualificatore (Qualifier) e Riserva (Rebuttal).' },
      { term: 'UDA (Unità di Apprendimento)', category: 'Progettazione Didattica', def: 'Unità didattica complessa e pluridisciplinare finalizzata al raggiungimento di competenze chiave attraverso la realizzazione di un compito di realtà o prodotto finale.' },
      { term: 'User Persona', category: 'Design Thinking', def: 'Profilo archetipico fittizio ma rappresentativo del target/utente finale per cui si sta progettando una soluzione, utilizzato nel Design Thinking per sviluppare empatia.' },
      { term: 'Valutazione Formativa (Formative Assessment)', category: 'Valutazione', def: 'Valutazione in itinere finalizzata a monitorare e sostenere il processo di apprendimento dello studente fornendo feedback tempestivi e orientativi, distinta dalla valutazione sommativa finale.' },
      { term: 'WebQuest', category: 'Didattica Investigativa', def: 'Attività di ricerca guidata in rete con ruoli predefiniti, in cui la maggior parte o tutte le informazioni utilizzate dagli studenti provengono da risorse web selezionate dal docente.' }
    ];

    const categories = [
      {
        id: 'mg1',
        icon: '👥',
        name: 'Collaborazione e Peer Learning',
        color: '#5C182B',
        desc: 'Metodologie centrate sulla collaborazione tra pari e l\'apprendimento cooperativo.',
        methods: [
          {
            id: 'm1',
            title: 'Cooperative Learning (es. Jigsaw)',
            principles: 'Gli studenti lavorano in gruppi eterogenei. Nel Jigsaw, ciascun membro del gruppo diventa "esperto" di una sottosezione del tema, la approfondisce con gli esperti degli altri gruppi e torna al gruppo base per insegnarla ai compagni.',
            studentRole: 'Co-costruttore: Attivo, responsabile dell\'apprendimento proprio e dei pari, facilitatore dei compagni.',
            teacherRole: 'Regista e Osservatore: Struttura i gruppi, distribuisce i ruoli, monitora le dinamiche e interviene in caso di stallo.',
            outcomes: 'Interdipendenza positiva, gestione del conflitto, responsabilizzazione individuale, comprensione profonda di argomenti complessi.',
            tags: ['Gruppi eterogenei', 'Jigsaw', 'Interdipendenza']
          },
          {
            id: 'm2',
            title: 'Peer Tutoring / Peer Instruction',
            principles: 'Attività tra pari in cui uno studente più esperto affianca un compagno per il consolidamento di abilità o il recupero, oppure risponde a quesiti concettuali (Peer Instruction con quesiti a scelta multipla e discussione in diade).',
            studentRole: 'Tutor / Tutee: Rielabora i contenuti con linguaggio paritario, mette a nudo i dubbi, consolida l\'autoefficacia.',
            teacherRole: 'Supervisore: Prepara i materiali stimolo, forma i tutor, valida i contenuti scambiati e orienta la discussione.',
            outcomes: 'Abbattimento delle barriere relazionali, personalizzazione dell\'apprendimento, consolidamento della metacognizione.',
            tags: ['Peer Instruction', 'Mazur', 'Metacognizione']
          }
        ],
        prompts: [
          {
            id: 'p1', num: 1, title: 'Progettazione Lezione Jigsaw (Cooperative Learning)',
            text: `Ruolo IA: Esperto in metodologie di apprendimento cooperativo per le scuole superiori.\n\nTask: Progetta una lezione di [inserire materia, es. Storia] di 2 ore sull'argomento "[inserire argomento, es. Le cause della Prima Guerra Mondiale]" utilizzando la metodologia Cooperative Learning Jigsaw.\n\nDettagli richiesti:\n1. Divisione dell'argomento in 4 sotto-temi specifici per i "Gruppi di Esperti".\n2. Istruzioni operative da consegnare al "Gruppo Base" e ai "Gruppi di Esperti".\n3. Tempistica precisa per ogni fase (Fase casa/intro, Fase esperti, Fase ricomposizione, Fase restituzione).\n4. Griglia di autovalutazione del lavoro svolto in gruppo.`
          },

    function getAllPrompts() {

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function highlightText(text, query) {
      if (!query) return esc(text);
      const safeText = esc(text);
      const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safeText.replace(new RegExp(`(${safeQuery})`, 'gi'), '<mark>$1</mark>');
    }

    function showToast(msg, icon = '✅', badgeClass = 'badge-success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = msg;
      toastIcon.textContent = icon;

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3000);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Testo copiato negli appunti!', '✅', 'badge-success');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Copiato negli appunti!', '✅', 'badge-success');
      } catch (e) {
        showToast('Errore nella copia manuale', '❌', 'badge-warning');
      }
      document.body.removeChild(ta);
    }

      ['welcome', 'explorer', 'generator', 'glossary', 'bookmarks'].forEach(v => {
        const btn = document.getElementById(`topnav-${v}`);
        if (btn) {
          if (v === view) btn.setAttribute('aria-current', 'page');
          else btn.removeAttribute('aria-current');
        }
      });

      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      text = text.replace(/\[inserire argomento, es\. [^\]]+\]/gi, appState.generatorInputs.argomento);

              <div>
                <label for="inputMetodologia" class="block text-xs font-bold text-[#1C1C1C] mb-1">Metodologia Principale:</label>
                <input type="text" id="inputMetodologia" value="${esc(appState.generatorInputs.metodologia)}" oninput="updateGenInput('metodologia', this.value)" class="w-full px-3 py-2 text-xs bg-white border border-[#F2EAD9] rounded-lg focus:border-[#5C182B]">
              </div>

              <!-- Input Argomento -->
              <div>
                <label for="inputArgomento" class="block text-xs font-bold text-[#1C1C1C] mb-1">Argomento Principale:</label>
                <input type="text" id="inputArgomento" value="${esc(appState.generatorInputs.argomento)}" oninput="updateGenInput('argomento', this.value)" class="w-full px-3 py-2 text-xs bg-white border border-[#F2EAD9] rounded-lg focus:border-[#5C182B]">
              </div>

              <!-- Input Ore -->
              <div>
                <label for="inputOre" class="block text-xs font-bold text-[#1C1C1C] mb-1">Durata / Ore complessive:</label>
                <input type="text" id="inputOre" value="${esc(appState.generatorInputs.ore)}" oninput="updateGenInput('ore', this.value)" class="w-full px-3 py-2 text-xs bg-white border border-[#F2EAD9] rounded-lg focus:border-[#5C182B]">
              </div>

            </div>

            <!-- Anteprima Live Output -->
            <div class="lg:col-span-7 bg-white p-6 rounded-xl border border-[#F2EAD9] shadow-sm flex flex-col justify-between space-y-4">
              <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-[#F2EAD9] pb-2">
                  <h2 class="font-serif-display font-bold text-lg text-[#5C182B]">
                    2. Anteprima Prompt Generato in Tempo Reale
                  </h2>
                  <span class="badge-status badge-success">
                    ✅ Pronto per l'uso
                  </span>
                </div>

                <pre id="generatorOutputBox" class="p-4 rounded-lg bg-[#1C1C1C] text-slate-100 font-mono-code text-xs leading-relaxed whitespace-pre-wrap overflow-x-auto min-h-[300px]" aria-live="polite">${esc(generatedText)}</pre>
              </div>

              <div class="flex items-center justify-between pt-4 border-t border-[#F2EAD9]">
                <span class="text-xs text-[#7A4D05] font-semibold">
                  🏷️ Categoria: ${cat ? esc(cat.name) : ''}
                </span>
                <button onclick="copyToClipboard(getGeneratedPromptText())" class="px-5 py-2.5 rounded-lg bg-[#5C182B] hover:bg-[#3D0F1C] text-white text-xs font-bold flex items-center gap-2 shadow-md">
                  📋 Copia Prompt Generato
                </button>
              </div>

            </div>

          </div>

        </div>
      `;
    }

    function renderGlossaryView() {
      const letters = ['ALL', ...new Set(glossaryTerms.map(t => t.term.charAt(0).toUpperCase()))].sort();
      
      const filteredTerms = glossaryTerms.filter(t => {
        if (appState.glossaryFilterLetter === 'ALL') return true;
        return t.term.charAt(0).toUpperCase() === appState.glossaryFilterLetter;
      }).sort((a, b) => a.term.localeCompare(b.term));

      return `
        <div class="space-y-8">
          
          <!-- Intestazione Glossario -->
          <div class="bg-white p-6 rounded-xl border border-[#F2EAD9] shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <span class="badge-status badge-progress mb-2">
                ⏳ Consultazione Concettuale
              </span>
              <h1 class="font-serif-display font-bold text-2xl sm:text-3xl text-[#5C182B]">
                📖 Glossario Tecnico della Didattica Attiva
              </h1>
              <p class="text-xs sm:text-sm text-[#1C1C1C] mt-1">
                Definizioni sintetiche e rigorose per ${glossaryTerms.length} termini chiave della pedagogia e delle metodologie attive.
              </p>
            </div>
            <div class="shrink-0 text-right">
              <span class="badge-status badge-success">
                ✅ ${glossaryTerms.length} Termini
              </span>
            </div>
          </div>

          <!-- Indice Alfabetico Filtro -->
          <div class="bg-white p-4 rounded-xl border border-[#F2EAD9] shadow-sm space-y-2">
            <p class="text-xs font-bold text-[#5C182B]">Filtra per Lettera Iniziale:</p>
            <div class="flex flex-wrap gap-1.5">
              ${letters.map(l => `
                <button onclick="setGlossaryLetter('${l}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${appState.glossaryFilterLetter === l ? 'bg-[#5C182B] text-white shadow-sm' : 'bg-[#FAF6EE] text-[#1C1C1C] hover:bg-[#F2EAD9]'}">
                  ${l === 'ALL' ? 'Tutti (A-Z)' : l}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Griglia Termini Glossario -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${filteredTerms.map(t => `
              <article class="bg-white p-6 rounded-xl border border-[#F2EAD9] shadow-sm space-y-3 hover:border-[#5C182B] transition-colors">
                <div class="flex items-start justify-between gap-2 border-b border-[#F2EAD9] pb-2">
                  <h2 class="font-serif-display font-bold text-lg text-[#5C182B]">${esc(t.term)}</h2>
                  <span class="px-2 py-0.5 rounded bg-[#FAF6EE] text-[10px] font-bold text-[#7A4D05] border border-[#F2EAD9] shrink-0">
                    ${esc(t.category)}
                  </span>
                </div>
                <p class="text-xs text-[#1C1C1C] leading-relaxed">${esc(t.def)}</p>
                <div class="pt-2 flex justify-end">
                  <button onclick="copyToClipboard('${esc(t.term)}: ${esc(t.def)}')" class="text-[11px] font-bold text-[#0047AB] hover:underline flex items-center gap-1">
                    📋 Copia Definizione
                  </button>
                </div>
              </article>
            `).join('')}
          </div>

        </div>
      `;
    }

    function setGlossaryLetter(letter) {
      appState.glossaryFilterLetter = letter;
      renderCurrentView();
    }

    function renderBookmarksView() {
      if (appState.bookmarks.length === 0) {
        return `
          <div class="bg-white p-10 rounded-xl border border-[#F2EAD9] text-center space-y-4 max-w-xl mx-auto my-12 shadow-sm">
            <div class="text-4xl">⭐</div>
            <h1 class="font-serif-display font-bold text-2xl text-[#5C182B]">Nessun Preferito Salvato</h1>
            <p class="text-xs text-[#1C1C1C]">
              Clicca sull'icona della stella (☆) presente su qualsiasi metodologia o prompt per salvarlo qui per un rapido consulto.
            </p>
            <button onclick="navigate('explorer')" class="px-4 py-2 rounded-lg bg-[#5C182B] text-white text-xs font-bold">
              📚 Vai all'Esploratore
            </button>
          </div>
        `;
      }

      const bookmarkedMethods = appState.bookmarks.filter(b => b.type === 'method').map(b => getMethod(b.id)).filter(Boolean);
      const bookmarkedPrompts = appState.bookmarks.filter(b => b.type === 'prompt').map(b => getPrompt(b.id)).filter(Boolean);

      return `
        <div class="space-y-8">
          
          <div class="bg-white p-6 rounded-xl border border-[#F2EAD9] shadow-sm flex items-center justify-between">
            <div>
              <span class="badge-status badge-success">
                ✅ ${appState.bookmarks.length} Elementi Salvati
              </span>
              <h1 class="font-serif-display font-bold text-2xl sm:text-3xl text-[#5C182B] mt-1">
                ⭐ I Miei Elementi Preferiti
              </h1>
            </div>
            <button onclick="appState.bookmarks=[]; saveBookmarks(); renderCurrentView();" class="px-3 py-1.5 rounded-lg bg-[#FFF1F2] text-[#B0004A] border border-[#FECDD3] text-xs font-bold">
              🗑️ Svuota Preferiti
            </button>
          </div>

          ${bookmarkedMethods.length > 0 ? `
            <section class="space-y-4">
              <h2 class="font-serif-display font-bold text-xl text-[#5C182B]">Metodologie Salvate (${bookmarkedMethods.length})</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${bookmarkedMethods.map(m => `
                  <div class="bg-white p-5 rounded-xl border border-[#F2EAD9] shadow-sm space-y-2">
                    <div class="flex items-start justify-between">
                      <h3 class="font-serif-display font-bold text-base text-[#5C182B]">${m.title}</h3>
                      <button onclick="toggleBookmark('method', '${m.id}')" class="text-sm">⭐</button>
                    </div>
                    <p class="text-xs text-[#1C1C1C] line-clamp-2">${m.principles}</p>
                    <button onclick="navigate('explorer', '${m.catId}')" class="text-xs font-bold text-[#0047AB] pt-2 inline-block">
                      Vedi nella categoria →
                    </button>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          ${bookmarkedPrompts.length > 0 ? `
            <section class="space-y-4">
              <h2 class="font-serif-display font-bold text-xl text-[#5C182B]">Prompt IA Salvati (${bookmarkedPrompts.length})</h2>
              <div class="space-y-4">
                ${bookmarkedPrompts.map(p => `
                  <div class="bg-white p-5 rounded-xl border border-[#F2EAD9] shadow-sm space-y-3">
                    <div class="flex items-center justify-between">
                      <h3 class="font-serif-display font-bold text-base text-[#5C182B]">Prompt #${p.num}: ${p.title}</h3>
                      <button onclick="toggleBookmark('prompt', '${p.id}')" class="text-sm">⭐</button>
                    </div>
                    <pre class="p-3 rounded bg-[#1C1C1C] text-slate-100 font-mono-code text-xs whitespace-pre-wrap max-h-40 overflow-y-auto">${esc(p.text)}</pre>
                    <div class="flex justify-end gap-2">
                      <button onclick="copyToClipboard(\`${p.text.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="px-3 py-1.5 rounded bg-[#5C182B] text-white text-xs font-bold">
                        📋 Copia
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

        </div>
      `;
    }

    function renderSearchView() {
      const q = appState.searchQuery.trim();
      if (!q || q.length < 2) {
        return `
          <div class="bg-white p-8 rounded-xl border border-[#F2EAD9] text-center max-w-md mx-auto my-12 space-y-2">
            <div class="text-3xl">🔍</div>
            <p class="font-bold text-sm text-[#5C182B]">Inserisci almeno 2 caratteri per cercare...</p>
          </div>
        `;
      }

      const matchingMethods = getAllMethods().filter(m => 
        m.title.toLowerCase().includes(q.toLowerCase()) || 
        m.principles.toLowerCase().includes(q.toLowerCase()) ||
        m.tags.some(t => t.toLowerCase().includes(q.toLowerCase()))
      );

      const matchingPrompts = getAllPrompts().filter(p => 
        p.title.toLowerCase().includes(q.toLowerCase()) || 
        p.text.toLowerCase().includes(q.toLowerCase())
      );

      const matchingGlossary = glossaryTerms.filter(t =>
        t.term.toLowerCase().includes(q.toLowerCase()) ||
        t.def.toLowerCase().includes(q.toLowerCase()) ||
        t.category.toLowerCase().includes(q.toLowerCase())
      );

      const totalResults = matchingMethods.length + matchingPrompts.length + matchingGlossary.length;

      return `
        <div class="space-y-8">
          
          <div class="bg-white p-6 rounded-xl border border-[#F2EAD9] shadow-sm">
            <span class="badge-status badge-progress">
              ⏳ Risultati della Ricerca
            </span>
            <h1 class="font-serif-display font-bold text-2xl text-[#5C182B] mt-1">
              Risultati per "${esc(q)}" (${totalResults})
            </h1>
          </div>

          ${totalResults === 0 ? `
            <div class="bg-white p-8 rounded-xl border border-[#F2EAD9] text-center max-w-md mx-auto space-y-3">
              <div class="text-3xl">❌ [Nessun risultato]</div>
              <p class="font-bold text-sm text-[#5C182B]">Nessun elemento corrisponde ai criteri inseriti.</p>
              <button onclick="navigate('welcome')" class="px-4 py-2 rounded-lg bg-[#5C182B] text-white text-xs font-bold">
                Torna alla Dashboard
              </button>
            </div>
          ` : ''}

          ${matchingGlossary.length > 0 ? `
            <section class="space-y-4">
              <h2 class="font-serif-display font-bold text-xl text-[#5C182B]">Termini di Glossario (${matchingGlossary.length})</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${matchingGlossary.map(t => `
                  <div class="bg-white p-5 rounded-xl border border-[#F2EAD9] shadow-sm space-y-2">
                    <div class="flex items-center justify-between">
                      <h3 class="font-serif-display font-bold text-base text-[#5C182B]">${highlightText(t.term, q)}</h3>
                      <span class="px-2 py-0.5 rounded bg-[#FAF6EE] text-[10px] font-bold text-[#7A4D05]">${esc(t.category)}</span>
                    </div>
                    <p class="text-xs text-[#1C1C1C]">${highlightText(t.def, q)}</p>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          ${matchingMethods.length > 0 ? `
            <section class="space-y-4">
              <h2 class="font-serif-display font-bold text-xl text-[#5C182B]">Metodologie Corrispondenti (${matchingMethods.length})</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${matchingMethods.map(m => `
                  <div class="bg-white p-5 rounded-xl border border-[#F2EAD9] shadow-sm space-y-2">
                    <h3 class="font-serif-display font-bold text-base text-[#5C182B]">${highlightText(m.title, q)}</h3>
                    <p class="text-xs text-[#1C1C1C] line-clamp-3">${highlightText(m.principles, q)}</p>
                    <button onclick="navigate('explorer', '${m.catId}')" class="text-xs font-bold text-[#0047AB] pt-2 inline-block">
                      Esplora Categoria →
                    </button>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          ${matchingPrompts.length > 0 ? `
            <section class="space-y-4">
              <h2 class="font-serif-display font-bold text-xl text-[#5C182B]">Prompt IA Corrispondenti (${matchingPrompts.length})</h2>
              <div class="space-y-4">
                ${matchingPrompts.map(p => `
                  <div class="bg-white p-5 rounded-xl border border-[#F2EAD9] shadow-sm space-y-3">
                    <h3 class="font-serif-display font-bold text-base text-[#5C182B]">Prompt #${p.num}: ${highlightText(p.title, q)}</h3>
                    <pre class="p-3 rounded bg-[#1C1C1C] text-slate-100 font-mono-code text-xs whitespace-pre-wrap max-h-40 overflow-y-auto">${highlightText(p.text, q)}</pre>
                    <div class="flex justify-end">
                      <button onclick="copyToClipboard(\`${p.text.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="px-3 py-1.5 rounded bg-[#5C182B] text-white text-xs font-bold">
                        📋 Copia
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      
      window.addEventListener('scroll', () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
        const pBar = document.getElementById('progressBar');
        const pContainer = document.getElementById('progressBarContainer');
        if (pBar) pBar.style.width = scrolled + "%";
        if (pContainer) pContainer.setAttribute('aria-valuenow', Math.round(scrolled));
      });

      const mobileBtn = document.getElementById('mobileMenuBtn');
      const mobileNav = document.getElementById('mobileNav');
      if (mobileBtn && mobileNav) {
        mobileBtn.addEventListener('click', () => {
          const isExpanded = mobileBtn.getAttribute('aria-expanded') === 'true';
          mobileBtn.setAttribute('aria-expanded', !isExpanded);
          mobileNav.classList.toggle('hidden');
        });
      }

      const searchInput = document.getElementById('globalSearchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          appState.searchQuery = e.target.value;
          if (clearSearchBtn) {
            clearSearchBtn.classList.toggle('hidden', appState.searchQuery.length === 0);
          }
          if (appState.searchQuery.trim().length >= 2) {
            appState.currentView = 'search';
            renderCurrentView();
          } else if (appState.searchQuery.trim().length === 0 && appState.currentView === 'search') {
            appState.currentView = 'welcome';
            renderCurrentView();
          }
        });
      }

      if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
          if (searchInput) searchInput.value = '';
          appState.searchQuery = '';
          clearSearchBtn.classList.add('hidden');
          appState.currentView = 'welcome';
          renderCurrentView();
        });
      }

      updateBookmarkCounters();
      renderCurrentView();
    });
  </script>
</body>
</html>
