  <script>
    const macroColors = ['#8b5cf6', '#ec4899', '#0284c7', '#d97706', '#10b981', '#ef4444', '#059669'];
    const tagClasses = [
      'bg-violet-100 text-violet-700 dark:bg-violet-950/60 dark:text-violet-300 border-violet-200 dark:border-violet-800/50',
      'bg-pink-100 text-pink-700 dark:bg-pink-950/60 dark:text-pink-300 border-pink-200 dark:border-pink-800/50',
      'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300 border-sky-200 dark:border-sky-800/50',
      'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 border-amber-200 dark:border-amber-800/50',
      'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800/50',
      'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border-rose-200 dark:border-rose-800/50',
      'bg-teal-100 text-teal-700 dark:bg-teal-950/60 dark:text-teal-300 border-teal-200 dark:border-teal-800/50'
    ];

    const categories = [
      {
        id: 'mg1', icon: 'fa-users', name: 'Collaborazione e Peer Learning', color: macroColors[0], tagClass: tagClasses[0],
        desc: 'Metodologie centrate sulla collaborazione tra pari e l\'apprendimento cooperativo.',
        methods: [
          {
            id: 'm1', title: 'Cooperative Learning (es. Jigsaw)',
            principles: 'Gli studenti lavorano in gruppi eterogenei. Nel Jigsaw, ciascun membro del gruppo diventa "esperto" di una sottosezione del tema, la approfondisce con gli esperti degli altri gruppi e torna al gruppo base per insegnarla ai compagni.',
            studentRole: 'Co-costruttore: Attivo, responsabile dell\'apprendimento proprio e dei pari, facilitatore dei compagni.',
            teacherRole: 'Regista e Osservatore: Struttura i gruppi, distribuisce i ruoli, monitora le dinamiche e interviene in caso di stallo.',
            outcomes: 'Interdipendenza positiva, gestione del conflitto, responsabilizzazione individuale, comprensione profonda di argomenti complessi.',
            tags: ['Gruppi eterogenei', 'Jigsaw', 'Interdipendenza']
          },
          {
            id: 'm2', title: 'Peer Tutoring / Peer Instruction',
            principles: 'Attività tra pari in cui uno studente più esperto (o a rotazione) affianca un compagno per il consolidamento di abilità o il recupero, oppure risponde a quesiti concettuali (Peer Instruction con quesiti a scelta multipla e discussione in diade).',
            studentRole: 'Tutor / Tutee: Rielabora i contenuti con linguaggio paritario, mette a nudo i dubbi, consolida l\'autoefficacia.',
            teacherRole: 'Supervisore: Prepara i materiali stimolo, forma i tutor, valida i contenuti scambiati e orienta la discussione.',
            outcomes: 'Abbattimento delle barriere relazionali, personalizzazione dell\'apprendimento, consolidamento della metacognizione.',
            tags: ['Peer Instruction', 'Mazur', 'Metacognizione']
          }
        ],
        prompts: [
          {
            id: 'p1', num: 1, title: 'Progettazione Lezione Jigsaw (Cooperative Learning)',
            text: `Ruolo IA: Esperto in metodologie di apprendimento cooperativo per le scuole superiori.\n\nTask: Progetta una lezione di [inserire materia, es. Storia] di 2 ore sull'argomento "[inserire argomento, es. Le cause della Prima Guerra Mondiale]" utilizzando la metodologia Cooperative Learning Jigsaw.\n\nDettagli richiesti:\n1. Divisione dell'argomento in 4 sotto-temi specifici per i "Gruppi di Esperti".\n2. Istruzioni operative da consegnare al "Gruppo Base" e ai "Gruppi di Esperti".\n3. Tempistica precisa per ogni fase (Fase casa/intro, Fase esperti, Fase ricomposizione, Fase restituzione).\n4. Griglia di autovalutazione del lavoro svolto in gruppo.`
          },
          {
            id: 'p2', num: 2, title: 'Sessione di Peer Instruction con Quesiti Concettuali',
            text: `Ruolo IA: Docente esperto nella metodologia Peer Instruction (metodo Mazur).\n\nTask: Crea un piano lezione di 60 minuti per [inserire materia, es. Fisica/Matematica/Filosofia] sul tema "[inserire tema]".\n\nDettagli richiesti:\n1. Scrivi 3 Conceptest (domande a scelta multipla con un distruttore convincente basato sulle misconcezioni più comuni degli studenti su questo tema).\n2. Per ciascun Conceptest, scrivi il flusso operativo della lezione: Voto individuale ➔ Discussione in diade (Peer Tutoring) ➔ Rivotazione ➔ Spiegazione del docente.\n3. Scrivi un breve script delle risposte o suggerimenti che il studente-tutor deve dare al compagno durante il confronto.`
          }
        ]
      },
      {
        id: 'mg2', icon: 'fa-puzzle-piece', name: 'Problem, Project & Challenge-Based', color: macroColors[1], tagClass: tagClasses[1],
        desc: 'Apprendimento basato su problemi, progetti e sfide reali.',
        methods: [
          {
            id: 'm3', title: 'Problem-Based Learning (PBL)',
            principles: 'Gli studenti affrontano uno scenario di problema reale, complesso e "mal definito" (ill-structured). Si identificano i bisogni di conoscenza, si formulano ipotesi, si ricerca in autonomia e si propone la soluzione.',
            studentRole: 'Solutore di problemi: Investigatore autonomo, analista critico, formulatore di ipotesi.',
            teacherRole: 'Scaffolder / Guida: Pone domande maieutiche, non fornisce risposte dirette, guida il processo euristico.',
            outcomes: 'Pensiero critico (critical thinking), problem solving complesso, autonomia nella ricerca informativa, auto-regolazione.',
            tags: ['Ill-structured', 'Pensiero critico', 'Autonomia']
          },
          {
            id: 'm4', title: 'Project-Based Learning (PjBL)',
            principles: 'Percorso a lungo termine strutturato attorno alla realizzazione di un prodotto finale visibile (report, prototipo, app, documentario, campagna media). Integra diverse discipline e momenti di revisione.',
            studentRole: 'Progettista e Creator: Pianifica le fasi, gestisce il tempo, realizza l\'artefatto e presenta il prodotto.',
            teacherRole: 'Project Manager / Coach: Definisce la rubric di valutazione, fornisce feedback in itinere, gestisce le scadenze.',
            outcomes: 'Project management, creatività applicata, sintesi multidisciplinare, gestione dello stress e delle scadenze.',
            tags: ['Prodotto finale', 'Multidisciplinare', 'Rubric']
          },
          {
            id: 'm5', title: 'Challenge-Based Learning (CBL)',
            principles: 'Evoluzione del PBL focalizzata su grandi sfide globali o locali (es. Agenda 2030, mobilità sostenibile). Richiede di passare dall\'analisi teorica all\'azione concreta e misurabile sul campo.',
            studentRole: 'Agente di cambiamento: Analizza contesti reali, progetta soluzioni pratiche e ne misura l\'impatto reale.',
            teacherRole: 'Facilitatore di rete: Connette la classe con esperti del settore, enti locali, aziende e organizzazioni territoriali.',
            outcomes: 'Consapevolezza civica, imprenditorialità, capacità di passare dall\'idea all\'azione, prototipazione rapida.',
            tags: ['Agenda 2030', 'Azione concreta', 'Impatto']
          }
        ],
        prompts: [
          {
            id: 'p3', num: 3, title: 'Generatore di Scenari "Ill-Structured" per PBL',
            text: `Ruolo IA: Instructional designer specializzato in Problem-Based Learning.\n\nTask: Crea un problema "ill-structured" (complesso, aperto, senza un'unica soluzione predefinita) da proporre a una classe di [inserire anno e indirizzo, es. 4° anno Istituto Tecnico Economico] per la disciplina [inserire materia].\n\nTraccia del Problema: Il problema deve riguardare un contesto di vita reale o professionale legato a "[inserire tema, es. La sostenibilità finanziaria di un'azienda locale in crisi]".\n\nFornisci:\n1. La lettera/dossier di scenario iniziale con cui presentare la situazione agli studenti.\n2. L'elenco delle "Domande Guida" che gli studenti dovranno porsi.\n3. Le risorse/documenti minimi da integrare (simulati).\n4. Il formato della proposta di soluzione richiesta alla classe.`
          },
          {
            id: 'p4', num: 4, title: 'Progettazione UDA Project-Based Learning (PjBL)',
            text: `Ruolo IA: Progettista didattico per competenze.\n\nTask: Progetta un'Unità di Apprendimento (UDA) basata sul Project-Based Learning interdisciplinare tra [Materia A] e [Materia B] per una classe di [inserire anno scolastico].\n\nOggetto del Progetto: Realizzazione di [inserire artefatto, es. Un podcast di 5 puntate o una campagna social su un tema storico/scientifico].\n\nIncludi:\n1. Il Driving Question (domanda guida motivante).\n2. La scansione temporale in 4 settimane con la Milestone finale di ogni settimana.\n3. I ruoli all'interno delle équipe di progetto.\n4. Una rubrica analitica di valutazione di prodotto (qualità dell'artefatto) e di processo (collaborazione, rispettare delle scadenze).`
          },
          {
            id: 'p5', num: 5, title: 'Challenge-Based Learning legato all\'Agenda 2030',
            text: `Ruolo IA: Esperto in educazione civica e didattica per sfide (Challenge-Based Learning).\n\nTask: Sviluppa un percorso CBL della durata di 10 ore incentrato sull'Obiettivo dell'Agenda 2030 numero [inserire n° Obiettivo, es. Goal 11: Città e Comunità Sostenibili].\n\nIncludi:\n1. Big Idea & Essential Question: La grande idea di partenza e la domanda essenziale.\n2. The Challenge: La formulazione della sfida pratica che la classe deve risolvere all'interno del proprio edificio scolastico o quartiere.\n3. Guiding Activities & Resources: Le attività d'indagine necessarie prima dell'azione.\n4. Solution & Action: Come far validare e testare sul campo la soluzione degli studenti dagli attori locali/scolastici.`
          }
        ]
      },
      {
        id: 'mg3', icon: 'fa-flask', name: 'Didattica Investigativa e di Ricerca', color: macroColors[2], tagClass: tagClasses[2],
        desc: 'Approcci basati sull\'indagine scientifica e la ricerca critica delle fonti.',
        methods: [
          {
            id: 'm6', title: 'Inquiry-Based Learning (IBSE)',
            principles: 'Basato sulle 5E (Engage, Explore, Explain, Elaborate, Evaluate). Gli studenti affrontano fenomeni naturali o sociali ponendo domande, formulando ipotesi, raccogliendo dati ed evidenze per giungere a spiegazioni formalizzate.',
            studentRole: 'Ricercatore scientifico: Osservatore analitico, raccoglitore ed elaboratore di dati e prove empiriche.',
            teacherRole: 'Mentore metodologico: Progetta le esperimentazioni/indagini, garantisce il rigore del metodo scientifico.',
            outcomes: 'Alfabetizzazione scientifica e informativa, pensiero logico-deduttivo, argomentazione basata su evidenze (evidence-based).',
            tags: ['5E Model', 'Evidence-based', 'Metodo scientifico']
          },
          {
            id: 'm7', title: 'WebQuest',
            principles: 'Attività di ricerca guidata in rete: il docente fornisce una struttura definita, ruoli specifici per gli studenti e una selezione di link ed emeroteche digitali sicure da analizzare per svolgere un compito complesso.',
            studentRole: 'Analista di fonti: Esploratore critico di risorse digitali, selezionatore di informazioni attendibili.',
            teacherRole: 'Curatore digitale: Mappa le risorse del web, progetta lo scenario di ricerca e la griglia di valutazione delle fonti.',
            outcomes: 'Information literacy, contrasto alle fake news, capacità di sintesi ed elaborazione di informazioni da fonti primarie.',
            tags: ['Information literacy', 'Fake news', 'Ricerca guidata']
          }
        ],
        prompts: [
          {
            id: 'p6', num: 6, title: 'Percorso Investigativo IBSE (5E Model)',
            text: `Ruolo IA: Formatore di didattica delle scienze/umanistica basata sull'Inquiry-Based Learning.\n\nTask: Progetta una sequenza didattica basata sul modello delle 5E (Engage, Explore, Explain, Elaborate, Evaluate) sul tema "[inserire tema, es. La fotosintesi e la respirazione cellulare / Il concetto di democrazia nell'antica Atene]".\n\nDettagli richiesti:\nDescrivi dettagliatamente cosa fa il docente e cosa fa lo studente per ciascuna delle 5 fasi:\n• Engage: Attività stimolo o provocazione concettuale.\n• Explore: Esperimento, simulazione o analisi diretta di fonti.\n• Explain: Formalizzazione dei concetti emersi.\n• Elaborate: Applicazione delle conoscenze in un contesto nuovo.\n• Evaluate: Valutazione formativa e autovalutazione.`
          },
          {
            id: 'p7', num: 7, title: 'Strutturazione di una WebQuest di Ricerca Critica',
            text: `Ruolo IA: Specialist in media ed education e WebQuest.\n\nTask: Crea il testo completo per una WebQuest destinata a studenti del triennio della scuola secondaria di secondo grado.\n\nArgomento: "[Inserire tema di ricerca, es. La disinformazione scientifica sui cambiamenti climatici]".\n\nGenera le 6 sezioni trasparenti:\n1. Introduzione: Scenario d'impatto.\n2. Compito (Task): Cosa dovranno produrre gli studenti.\n3. Processo: Passaggi dettagliati con divisione in ruoli (es. il Giornalista, il Data Scientist, lo Storico, il Fact-checker).\n4. Risorse: Tipologia di link ed archivi da consultare (con suggerimenti sui criteri di validazione).\n5. Valutazione: Rubrica analitica di qualità della ricerca.\n6. Conclusione: Domanda di riflessione metacognitiva.`
          }
        ]
      },
      {
        id: 'mg4', icon: 'fa-scale-balanced', name: 'Argomentazione, Simulazione e Decisori', color: macroColors[3], tagClass: tagClasses[3],
        desc: 'Debate, studi di caso e simulazioni operative per sviluppare il pensiero argomentativo.',
        methods: [
          {
            id: 'm8', title: 'Debate (Dibattito Regolamentato)',
            principles: 'Metodologia formale in cui due squadre sostengono e confutano una mozione controversa (pro vs contro), rispettando regole di tempo, ruoli definiti e assenza di attacchi personali.',
            studentRole: 'Debatter / Oratore: Ricercatore di tesi e prove, ascoltatore attivo della controparte, parlatore pubblico.',
            teacherRole: 'Giudice / Moderatore: Insegna la struttura delle argomentazioni (Toulmin Model), gestisce i tempi e valuta senza pregiudizi.',
            outcomes: 'Public speaking, confutazione logica, rispetto delle opinioni altrui, empatia (sostenere anche posizioni non condivise).',
            tags: ['Public speaking', 'Toulmin', 'Pro vs Contro']
          },
          {
            id: 'm9', title: 'Studio di Caso (Case Study)',
            principles: 'Analisi dettagliata di una situazione reale o simulata (un caso legale, finanziario, etico, storico, aziendale). Gli studenti studiano i dati forniti e prendono decisioni strategiche argomentandole.',
            studentRole: 'Decision-maker: Analista di scenari di complessità, decisore in contesti di incertezza.',
            teacherRole: 'Facilitatore di discussione: Presenta il caso, stimola il dibattito collegiale, mette in luce le implicazioni di ogni scelta.',
            outcomes: 'Capacità decisionale, applicazione di norme e concetti astratti a contesti reali, valutazione dei rischi.',
            tags: ['Decision-making', 'Scenari reali', 'Analisi']
          },
          {
            id: 'm10', title: 'Role Playing e Simulazione Operativa',
            principles: 'Gli studenti assumono ruoli specifici (es. simulazione dell\'ONU - MUN, processo storico, consiglio d\'amministrazione) per comprendere prospettive diverse e negoziare soluzioni.',
            studentRole: 'Attore / Negoziatore: Sospende il proprio giudizio, immedesimandosi nei vincoli e negli interessi del ruolo assegnato.',
            teacherRole: 'Scenografo e Regista: Pone i vincoli dello scenario, fornisce i dossier di ruolo e conduce la fase di debriefing.',
            outcomes: 'Empatia relazionale, negoziazione, risoluzione di conflitti, comprensione di dinamiche sistemiche e geopolitiche.',
            tags: ['MUN', 'Negoziazione', 'Debriefing']
          }
        ],

    let state = {
      currentView: 'welcome', // welcome | category | method | prompts | prompt-detail | bookmarks | search | glossary
      currentCatId: null,
      currentMethodId: null,
      currentPromptId: null,
      glossaryFilterLetter: 'ALL',
      glossaryQuery: '',
      openCats: {},
      searchQuery: '',
      bookmarks: JSON.parse(localStorage.getItem('didattica_bookmarks') || '[]'),
      darkMode: localStorage.getItem('didattica_theme') === 'dark',
      customInputs: {}
    };

    function saveBookmarks() {
      localStorage.setItem('didattica_bookmarks', JSON.stringify(state.bookmarks));
      updateBookmarkBadge();
    }

    function isBookmarked(type, id) {
      return state.bookmarks.some(b => b.type === type && b.id === id);
    }

    function toggleBookmark(type, id) {
      if (isBookmarked(type, id)) {
        state.bookmarks = state.bookmarks.filter(b => !(b.type === type && b.id === id));
        showToast('Rimosso dai preferiti', 'fa-circle-xmark', 'text-rose-400');
      } else {
        state.bookmarks.push({ type, id, date: Date.now() });
        showToast('Aggiunto ai preferiti!', 'fa-star', 'text-amber-400');
      }
      saveBookmarks();
      renderAll();
    }

    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmarkBadge');
      if (badge) badge.textContent = state.bookmarks.length;
    }

    function getAllMethods() {
      return categories.flatMap(c => c.methods.map(m => ({...m, catId: c.id, catName: c.name, catIcon: c.icon, catColor: c.color, catTagClass: c.tagClass})));
    }

    function getAllPrompts() {
      return categories.flatMap(c => c.prompts.map(p => ({...p, catId: c.id, catName: c.name, catIcon: c.icon, catColor: c.color, catTagClass: c.tagClass})));
    }

    function getCat(id) { return categories.find(c => c.id === id); }
    function getMethod(id) { return getAllMethods().find(m => m.id === id); }
    function getPrompt(id) { return getAllPrompts().find(p => p.id === id); }

    function escHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function highlightText(text, query) {
      if (!query) return escHtml(text);
      const safe = escHtml(text);
      const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${q})`, 'gi'), '<mark>$1</mark>');
    }

    function showToast(msg, icon = 'fa-circle-check', colorClass = 'text-emerald-400') {
      const t = document.getElementById('toast');
      const tMsg = document.getElementById('toastMsg');
      const tIcon = document.getElementById('toastIcon');
      
      tMsg.textContent = msg;
      tIcon.className = `fa-solid ${icon} ${colorClass} text-sm`;
      
      t.classList.remove('translate-y-20', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        t.classList.remove('translate-y-0', 'opacity-100');
        t.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        showToast('Copiato negli appunti!');
      } catch (e) {
        showToast('Errore nella copia', 'fa-triangle-exclamation', 'text-rose-400');
      }
    }

    function extractPlaceholders(text) {
      const regex = /\[(.*?)\]/g;
      const matches = [];
      let match;
      while ((match = regex.exec(text)) !== null) {
        if (!matches.includes(match[1])) {
          matches.push(match[1]);
        }
      }
      return matches;
    }

    function getCustomizedPromptText(promptId) {
      const prompt = getPrompt(promptId);
      if (!prompt) return '';
      let text = prompt.text;
      const placeholders = extractPlaceholders(text);
      
      placeholders.forEach(ph => {
        const key = `${promptId}_${ph}`;
        const userVal = state.customInputs[key];
        if (userVal && userVal.trim() !== '') {
          text = text.replaceAll(`[${ph}]`, userVal.trim());
        }
      });
      return text;
    }

    function navigate(view, catId = null, methodId = null, promptId = null) {
      state.currentView = view;
      state.currentCatId = catId;
      state.currentMethodId = methodId;
      state.currentPromptId = promptId;

      if (view !== 'search') {
        state.searchQuery = '';
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        document.getElementById('clearSearchBtn')?.classList.add('hidden');
      }

      if (catId) state.openCats[catId] = true;

      const hash = view === 'welcome' ? '' :
                   view === 'bookmarks' ? 'bookmarks' :
                   view === 'glossary' ? 'glossary' :
                   view === 'category' ? `cat-${catId}` :
                   view === 'method' ? `method-${methodId}` :
                   view === 'prompts' ? `prompts-${catId}` :
                   view === 'prompt-detail' ? `prompt-${promptId}` :
                   view === 'search' ? `search-${encodeURIComponent(state.searchQuery)}` : '';
      
      location.hash = hash;
      renderAll();
    }

    function readHash() {
      const h = location.hash.slice(1);
      if (!h) { navigate('welcome'); return; }
      if (h === 'bookmarks') { state.currentView = 'bookmarks'; }
      else if (h === 'glossary') { state.currentView = 'glossary'; }
      else if (h.startsWith('cat-')) { state.currentView = 'category'; state.currentCatId = h.replace('cat-',''); state.openCats[state.currentCatId] = true; }
      else if (h.startsWith('method-')) { state.currentView = 'method'; state.currentMethodId = h.replace('method-',''); const m = getMethod(state.currentMethodId); if(m) { state.currentCatId = m.catId; state.openCats[m.catId] = true; } }
      else if (h.startsWith('prompts-')) { state.currentView = 'prompts'; state.currentCatId = h.replace('prompts-',''); state.openCats[state.currentCatId] = true; }
      else if (h.startsWith('prompt-')) { state.currentView = 'prompt-detail'; state.currentPromptId = h.replace('prompt-',''); const p = getPrompt(state.currentPromptId); if(p) { state.currentCatId = p.catId; state.openCats[p.catId] = true; } }
      else if (h.startsWith('search-')) { state.currentView = 'search'; state.searchQuery = decodeURIComponent(h.replace('search-','')); }
      else { state.currentView = 'welcome'; }
      renderAll();
    }

    function renderGlossaryView() {
      const q = state.glossaryQuery.trim().toLowerCase();
      const selectedLetter = state.glossaryFilterLetter;

      // Extract unique first letters
      const letters = Array.from(new Set(glossaryTerms.map(t => t.term.charAt(0).toUpperCase()))).sort();

      const filteredTerms = glossaryTerms.filter(t => {
        const matchesQuery = !q || t.term.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q) || t.tags.some(tag => tag.toLowerCase().includes(q));
        const matchesLetter = selectedLetter === 'ALL' || t.term.charAt(0).toUpperCase() === selectedLetter;
        return matchesQuery && matchesLetter;
      });

      return `
        <div class="max-w-5xl mx-auto space-y-6 fade-in">
          
          <!-- Breadcrumb -->
          <nav class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">

            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <span class="text-slate-800 dark:text-slate-200 font-semibold truncate">Glossario Pedagogico</span>
          </nav>

          <!-- Header -->
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm border-l-8 border-l-emerald-500 space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <i class="fa-solid fa-book-atlas text-emerald-500"></i> Glossario Didattica & Pedagogia
                </h1>
                <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-1">
                  Guida completa ai concetti, modelli teorici, acronimi e metodologie operative.
                </p>
              </div>
              <div class="px-3 py-1.5 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 font-semibold text-xs shrink-0 text-center">
                ${filteredTerms.length} di ${glossaryTerms.length} Termini
              </div>
            </div>

            <!-- Glossary Local Search Box -->
            <div class="relative max-w-md">
              <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" value="${escHtml(state.glossaryQuery)}" 
                oninput="updateGlossaryQuery(this.value)"
                placeholder="Filtra termini nel glossario..." 
                class="w-full pl-9 pr-8 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition-all">
              ${state.glossaryQuery ? `
                <button onclick="updateGlossaryQuery('')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">
                  <i class="fa-solid fa-circle-xmark"></i>
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Alphabetical Filter Bar -->
          <div class="flex flex-wrap items-center gap-1.5 p-3 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-xs">
            <span class="font-bold text-slate-400 text-[11px] mr-2 uppercase">Indice:</span>
            <button onclick="setGlossaryLetter('ALL')" class="px-2.5 py-1 rounded-lg font-semibold transition-all ${selectedLetter === 'ALL' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">
              Tutti (${glossaryTerms.length})
            </button>
            ${letters.map(letter => `
              <button onclick="setGlossaryLetter('${letter}')" class="w-8 h-8 rounded-lg font-semibold flex items-center justify-center transition-all ${selectedLetter === letter ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">
                ${letter}
              </button>
            `).join('')}
          </div>

          <!-- Terms Grid -->
          ${filteredTerms.length === 0 ? `
            <div class="text-center py-12 space-y-3 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
              <i class="fa-solid fa-book-open-reader text-3xl text-slate-400"></i>
              <h3 class="font-bold text-slate-700 dark:text-slate-300">Nessun termine corrisponde ai criteri</h3>

                        #${tag}
                      </span>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          `}

        </div>
      `;
    }

          <div class="flex items-center justify-between pt-2">
            <button onclick="navigate('prompt-detail', '${cat ? cat.id : ''}', null, '${p.id}')" 
              class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-400">
              Vedi in vista isolata →
            </button>

            <button onclick="copyToClipboard(getCustomizedPromptText('${p.id}'))" 
              class="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold flex items-center gap-2 shadow-md shadow-violet-500/20 transition-all">
              <i class="fa-solid fa-copy"></i>
              <span>Copia Prompt</span>
            </button>
          </div>

        </div>
      `;
    }

    function updatePromptInput(promptId, placeholder, value) {
      const key = `${promptId}_${placeholder}`;
      state.customInputs[key] = value;
      
      const updatedText = getCustomizedPromptText(promptId);
      const previewElems = document.querySelectorAll(`[data-prompt-preview="${promptId}"]`);
      previewElems.forEach(elem => {
        elem.textContent = updatedText;
      });
    }

    function copyAllCatPrompts(catId) {
      const cat = getCat(catId);
      if (!cat) return;
      const allText = cat.prompts.map(p => `=== PROMPT #${p.num}: ${p.title} ===\n\n${getCustomizedPromptText(p.id)}`).join('\n\n' + '='.repeat(40) + '\n\n');
      copyToClipboard(allText);
    }

    function renderPromptDetailView() {
      const p = getPrompt(state.currentPromptId);
      if (!p) return '<p class="text-slate-500">Prompt non trovato.</p>';
      const cat = getCat(p.catId);

      return `
        <div class="max-w-4xl mx-auto space-y-6 fade-in">
          <nav class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
            <button onclick="navigate('welcome')" class="hover:text-violet-500">Dashboard</button>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <button onclick="navigate('category', '${cat.id}')" class="hover:text-violet-500 truncate">${cat.name}</button>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <button onclick="navigate('prompts', '${cat.id}')" class="hover:text-violet-500">Prompt IA</button>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <span class="text-slate-800 dark:text-slate-200 font-semibold truncate">Prompt #${p.num}</span>
          </nav>

          <div class="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${cat.tagClass}">
                <i class="fa-solid ${cat.icon} mr-1"></i> ${cat.name}
              </span>
              <h1 class="text-2xl font-bold text-slate-900 dark:text-white mt-3">Prompt #${p.num}: ${p.title}</h1>
            </div>

            ${renderPromptCard(p)}
          </div>
        </div>
      `;
    }

    function renderBookmarksView() {
      if (state.bookmarks.length === 0) {
        return `
          <div class="max-w-xl mx-auto text-center py-16 space-y-4 fade-in">
            <div class="w-16 h-16 rounded-full bg-amber-100 dark:bg-amber-950/50 text-amber-500 flex items-center justify-center text-2xl mx-auto">
              <i class="fa-solid fa-star"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Nessun preferito salvato</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              Clicca sull'icona della stella presente su qualsiasi metodologia o prompt per salvarlo qui per un accesso rapido.
            </p>
            <button onclick="navigate('welcome')" class="px-4 py-2 rounded-xl bg-violet-600 text-white text-xs font-semibold hover:bg-violet-700">
              Torna alla Dashboard
            </button>
          </div>
        `;
      }

      const bookmarkedMethods = state.bookmarks.filter(b => b.type === 'method').map(b => getMethod(b.id)).filter(Boolean);
      const bookmarkedPrompts = state.bookmarks.filter(b => b.type === 'prompt').map(b => getPrompt(b.id)).filter(Boolean);

      return `
        <div class="max-w-5xl mx-auto space-y-8 fade-in">
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
            <h1 class="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <i class="fa-solid fa-star text-amber-500"></i> I Miei Elementi Preferiti
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${state.bookmarks.length} elementi salvati nel tuo browser</p>
          </div>

          ${bookmarkedMethods.length > 0 ? `
            <div class="space-y-4">
              <h3 class="font-bold text-slate-900 dark:text-white text-sm uppercase tracking-wider">Metodologie Salvate (${bookmarkedMethods.length})</h3>
              <div class="grid grid-cols-1 gap-4">
                ${bookmarkedMethods.map(m => {
                  const cat = getCat(m.catId);
                  return `
                    <div class="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between gap-4">
                      <div>
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${cat.tagClass}">${cat.name}</span>
                        <h4 class="font-bold text-sm text-slate-900 dark:text-white mt-1">${m.title}</h4>
                      </div>
                      <div class="flex items-center gap-2">
                        <button onclick="navigate('method', '${cat.id}', '${m.id}')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-xs font-semibold">Vedi</button>
                        <button onclick="toggleBookmark('method', '${m.id}')" class="p-1.5 text-amber-500 hover:text-slate-400"><i class="fa-solid fa-star"></i></button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          ${bookmarkedPrompts.length > 0 ? `
            <div class="space-y-4">
              <h3 class="font-bold text-slate-900 dark:text-white text-sm uppercase tracking-wider">Prompt IA Salvati (${bookmarkedPrompts.length})</h3>
              <div class="space-y-4">
                ${bookmarkedPrompts.map(p => renderPromptCard(p)).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSearchView() {
      const q = state.searchQuery.trim();
      if (!q || q.length < 2) {
        return `
          <div class="max-w-md mx-auto text-center py-16 text-slate-500 space-y-2 fade-in">
            <i class="fa-solid fa-magnifying-glass text-3xl text-slate-400"></i>
            <p class="text-sm font-semibold">Digita almeno 2 caratteri per cercare...</p>
          </div>
        `;
      }

      const methods = getAllMethods().filter(m => matchItem(m, q));
      const prompts = getAllPrompts().filter(p => matchPrompt(p, q));
      const glossaryResults = glossaryTerms.filter(t => t.term.toLowerCase().includes(q.toLowerCase()) || t.desc.toLowerCase().includes(q.toLowerCase()));
      const total = methods.length + prompts.length + glossaryResults.length;

      if (total === 0) {
        return `
          <div class="max-w-md mx-auto text-center py-16 space-y-3 fade-in">
            <i class="fa-solid fa-face-frown text-4xl text-slate-400"></i>
            <h3 class="font-bold text-slate-800 dark:text-slate-200">Nessun risultato trovato</h3>
            <p class="text-xs text-slate-500">Nessuna corrispondenza per "${escHtml(q)}". Prova con altri termini di ricerca.</p>
          </div>
        `;
      }

      return `
        <div class="max-w-5xl mx-auto space-y-8 fade-in">
          
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
            <h1 class="text-lg font-bold text-slate-900 dark:text-white">
              Risultati di ricerca per: <span class="text-violet-600 dark:text-violet-400">"${escHtml(q)}"</span>
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Trovati ${total} elementi (${methods.length} metodologie, ${prompts.length} prompt, ${glossaryResults.length} glossario)</p>
          </div>

          ${glossaryResults.length > 0 ? `
            <div class="space-y-4">
              <h3 class="font-bold text-slate-900 dark:text-white text-sm uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
                <i class="fa-solid fa-book-atlas mr-1"></i> Termini Glossario (${glossaryResults.length})
              </h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${glossaryResults.map(t => `
                  <div onclick="navigate('glossary'); state.glossaryQuery='${t.term.replace(/'/g, "\\'")}';" class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-800/60 shadow-sm hover:border-emerald-500 cursor-pointer transition-all space-y-2">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300">${t.cat}</span>
                    <h4 class="font-bold text-sm text-slate-900 dark:text-white">${highlightText(t.term, q)}</h4>
                    <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${highlightText(t.desc, q)}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${methods.length > 0 ? `
            <div class="space-y-4">
              <h3 class="font-bold text-slate-900 dark:text-white text-sm uppercase tracking-wider">Metodologie (${methods.length})</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${methods.map(m => {
                  const cat = getCat(m.catId);
                  return `
                    <div onclick="navigate('method', '${m.catId}', '${m.id}')" 
                      class="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm hover:border-violet-400 cursor-pointer transition-all space-y-2">
                      <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${m.catTagClass}">${cat.name}</span>
                      <h4 class="font-bold text-sm text-slate-900 dark:text-white">${highlightText(m.title, q)}</h4>
                      <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${highlightText(m.principles, q)}</p>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          ${prompts.length > 0 ? `
            <div class="space-y-4">
              <h3 class="font-bold text-slate-900 dark:text-white text-sm uppercase tracking-wider">Prompt IA (${prompts.length})</h3>
              <div class="space-y-4">
                ${prompts.map(p => renderPromptCard(p)).join('')}
              </div>
            </div>
          ` : ''}

        </div>
      `;
    }

    function matchItem(m, q) {
      if (!q) return false;
      const low = q.toLowerCase();
      return m.title.toLowerCase().includes(low) ||
             m.principles.toLowerCase().includes(low) ||
             m.studentRole.toLowerCase().includes(low) ||
             m.teacherRole.toLowerCase().includes(low) ||
             m.outcomes.toLowerCase().includes(low) ||
             (m.tags && m.tags.some(t => t.toLowerCase().includes(low)));
    }

    function matchPrompt(p, q) {
      if (!q) return false;
      const low = q.toLowerCase();
      return p.title.toLowerCase().includes(low) || p.text.toLowerCase().includes(low);
    }

    function renderAll() {
      renderCategoryNav();
      renderTopbar();
      renderContent();
      updateBookmarkBadge();
    }

    function applyTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');

      if (state.darkMode) {
        html.classList.add('dark');
        if (icon) icon.className = 'fa-solid fa-sun text-amber-400';
        if (label) label.textContent = 'Tema Chiaro';
        localStorage.setItem('didattica_theme', 'dark');
      } else {
        html.classList.remove('dark');
        if (icon) icon.className = 'fa-solid fa-moon text-violet-400';
        if (label) label.textContent = 'Tema Scuro';
        localStorage.setItem('didattica_theme', 'light');
      }
    }

    // Event Listeners Initialization
    window.addEventListener('load', () => {
      applyTheme();
      
      // Theme Toggle
      document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        applyTheme();
      });

      // Search Inputs
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          if (clearSearchBtn) {
            clearSearchBtn.classList.toggle('hidden', state.searchQuery.length === 0);
          }

          if (state.searchQuery.trim().length >= 2) {
            state.currentView = 'search';
            location.hash = 'search-' + encodeURIComponent(state.searchQuery);
            renderAll();
          } else if (state.searchQuery.trim().length === 0 && state.currentView === 'search') {
            navigate('welcome');
          }
        });
      }

      if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
          if (searchInput) searchInput.value = '';
          state.searchQuery = '';
          clearSearchBtn.classList.add('hidden');
          navigate('welcome');
        });
      }

      // Mobile Sidebar Controls
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      const openBtn = document.getElementById('openSidebarBtn');
      const closeBtn = document.getElementById('closeSidebarBtn');

      function openSidebar() {
        sidebar?.classList.remove('-translate-x-full');
        backdrop?.classList.remove('hidden');
      }

      function closeSidebar() {
        sidebar?.classList.add('-translate-x-full');
        backdrop?.classList.add('hidden');
      }

      openBtn?.addEventListener('click', openSidebar);
      closeBtn?.addEventListener('click', closeSidebar);
      backdrop?.addEventListener('click', closeSidebar);

      // Hash Sync
      window.addEventListener('hashchange', readHash);
      readHash();
    });
  </script>
</body>
</html>
