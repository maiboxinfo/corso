<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA a Scuola — Guida Pratica per Studenti (MIM)</title>
  <style>
    :root {
      /* Colori primari */
      --color-hero: #0E47CB;
      --color-outline: #1A1A4E;
      --color-primary: #2F54EB;

      /* Accenti */
      --color-accent-yellow: #F5A623;
      --color-accent-teal: #3DD9C5;
      --color-accent-coral: #E84545;

      /* Sfondi */
      --color-bg: #FFFFFF;
      --color-bg-soft: #F4F5F7;

      /* Testo */
      --color-text: #1A1A2E;

      /* Ombre piatte (15% più scuro, no blur) */
      --shadow-flat: 2px 2px 0 rgba(26,26,78,0.15);
      --shadow-flat-hover: 4px 4px 0 rgba(26,26,78,0.2);

      /* Tratto */
      --stroke-width: 2.5px;
      --radius-base: 12px;
      --radius-sm: 8px;
    }

    /* Reset e stili base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--color-text);
      background-color: var(--color-bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header e Navigazione */
    .app-header {
      background: var(--color-bg);
      border-bottom: var(--stroke-width) solid var(--color-outline);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 0 rgba(26,26,78,0.05);
    }

    .app-header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--color-text);
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: var(--color-accent-yellow);
      color: var(--color-outline);
      border: var(--stroke-width) solid var(--color-outline);
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .app-nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      color: var(--color-text);
      text-decoration: none;
      padding: 0.5rem 0.85rem;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      border: var(--stroke-width) solid transparent;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-btn:hover, .nav-btn:focus-visible {
      border-color: var(--color-outline);
      background: var(--color-bg-soft);
      outline: none;
    }

    .nav-btn.active {
      background: var(--color-hero);
      color: #FFFFFF;
      border-color: var(--color-outline);
      box-shadow: var(--shadow-flat);
    }

    /* Container principale */
    .app-main {
      min-height: calc(100vh - 160px);
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Modulo Hero Istituzionale */
    .hero {
      background: var(--color-hero);
      color: #FFFFFF;
      padding: 3rem 2rem;
      border-radius: var(--radius-base);
      border: var(--stroke-width) solid var(--color-outline);
      box-shadow: 4px 4px 0 var(--color-outline);
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 868px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      .hero-illustration {
        justify-self: center;
      }
    }

    .hero-tag {
      display: inline-block;
      background: var(--color-accent-teal);
      color: var(--color-outline);
      font-weight: 800;
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      border: var(--stroke-width) solid var(--color-outline);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hero h1 {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.1rem;
      opacity: 0.95;
      margin-bottom: 1.5rem;
      max-width: 650px;
    }

    .hero-cta-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Pulsanti Istituzionali */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      padding: 0.75rem 1.4rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: var(--shadow-flat);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
      user-select: none;
      background: #FFFFFF;
      color: var(--color-text);
    }

    .btn:hover, .btn:focus-visible {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-flat-hover);
      outline: 2px solid var(--color-outline);
    }

    .btn:active {
      transform: translate(0, 0);
      box-shadow: 1px 1px 0 rgba(26,26,78,0.15);
    }

    .btn-primary { background: var(--color-primary); color: #FFFFFF; }
    .btn-accent-yellow { background: var(--color-accent-yellow); color: var(--color-outline); }
    .btn-accent-teal { background: var(--color-accent-teal); color: var(--color-outline); }
    .btn-accent-coral { background: var(--color-accent-coral); color: #FFFFFF; }

    /* Card standard */
    .card {
      background: var(--color-bg);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      box-shadow: var(--shadow-flat);
      padding: 1.5rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-flat-hover);
    }

    .card-soft {
      background: var(--color-bg-soft);
    }

    /* Griglie responsive */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    /* Sezione Titolo */
    .section-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-subtitle {
      font-size: 1.05rem;
      color: #4A4A68;
      margin-bottom: 1.8rem;
    }

    /* Copilota & Regola Finale Boxes */
    .copilota-box {
      background: var(--color-bg-soft);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-flat);
    }

    .copilota-flow {
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      background: #FFFFFF;
      padding: 1.2rem;
      border-radius: var(--radius-sm);
      border: var(--stroke-width) solid var(--color-outline);
    }

    .copilota-step {
      text-align: center;
      flex: 1;
      min-width: 140px;
    }

    .copilota-step-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-soft);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: 50%;
    }

    .copilota-arrow {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-primary);
    }

    /* Semaforo Component */
    .semaforo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      border: var(--stroke-width) solid var(--color-outline);
      text-transform: uppercase;
    }

    .semaforo-verde { background: var(--color-accent-teal); color: var(--color-outline); }
    .semaforo-giallo { background: var(--color-accent-yellow); color: var(--color-outline); }
    .semaforo-rosso { background: var(--color-accent-coral); color: #FFFFFF; }

    /* Card Prompt */
    .prompt-card {
      background: #FFFFFF;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      box-shadow: var(--shadow-flat);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .prompt-card-header {
      background: var(--color-bg-soft);
      padding: 1rem 1.25rem;
      border-bottom: var(--stroke-width) solid var(--color-outline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .prompt-num {
      background: var(--color-primary);
      color: #FFFFFF;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: var(--stroke-width) solid var(--color-outline);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .prompt-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--color-text);
      flex: 1;
    }

    .prompt-card-body {
      padding: 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .prompt-box {
      background: var(--color-bg-soft);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-sm);
      padding: 1rem;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.88rem;
      color: var(--color-text);
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .prompt-action-bar {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
      pt: 0.5rem;
    }

    /* Modal e Drawers per personalizzazione */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(26, 26, 78, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: #FFFFFF;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      box-shadow: 6px 6px 0 var(--color-outline);
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: var(--stroke-width) solid var(--color-outline);
      padding-bottom: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .modal-close {
      background: none;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--color-bg-soft);
      color: var(--color-text);
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      background: #FFFFFF;
      box-shadow: var(--shadow-flat);
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: var(--color-accent-teal);
      color: var(--color-outline);
      border: var(--stroke-width) solid var(--color-outline);
      padding: 0.8rem 1.2rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-flat);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Tag filtri */
    .filter-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      padding: 0.4rem 0.85rem;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: 20px;
      background: #FFFFFF;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn.active {
      background: var(--color-primary);
      color: #FFFFFF;
      box-shadow: var(--shadow-flat);
    }

    /* Footer */
    .app-footer {
      background: var(--color-bg-soft);
      border-top: var(--stroke-width) solid var(--color-outline);
      padding: 2rem 1.5rem;
      margin-top: 3rem;
    }

    .app-footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 500px;
    }

    .badge-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }

    .timeline-step {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
      align-items: flex-start;
    }

    .timeline-num {
      background: var(--color-accent-yellow);
      color: var(--color-outline);
      border: var(--stroke-width) solid var(--color-outline);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-container">
      <a href="#" class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect x="2" y="2" width="28" height="28" rx="8" fill="#0E47CB" stroke="#1A1A4E" stroke-width="2.5"/>
          <path d="M10 16L14 20L22 12" stroke="#3DD9C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>IA A SCUOLA</span>
        <span class="brand-badge">Linee Guida MIM 2025</span>
      </a>

      <nav class="app-nav" id="mainNav">
        <a href="#home" class="nav-btn active" data-route="home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Home
        </a>
        <a href="#prompts" class="nav-btn" data-route="prompts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          25 Prompt Pratici
        </a>
        <a href="#generator" class="nav-btn" data-route="generator">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          Generatore Prompt
        </a>
        <a href="#semaforo" class="nav-btn" data-route="semaforo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          Semaforo IA
        </a>
        <a href="#dichiarazione" class="nav-btn" data-route="dichiarazione">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Log Registro
        </a>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app" class="app-main"></main>

  <!-- Container Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal Personalizzazione Prompt -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-weight: 800; color: var(--color-text);">Personalizza il Prompt</h3>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div id="modalBody">
        <!-- Generato dinamicamente -->
      </div>
    </div>
  </div>

  <!-- Footer Istituzionale -->
  <footer class="app-footer">
    <div class="app-footer-container">
      <div>
        <p><strong>IA A SCUOLA</strong> — Guida pratica per studenti</p>
        <p style="font-size: 0.8rem; opacity: 0.8; margin-top: 0.2rem;">Basato sulle Linee guida del Ministero dell'Istruzione e del Merito (MIM)</p>
      </div>
      <div>
        <p>&copy; 2026 — Rispettiamo l'Etica dell'Apprendimento</p>
      </div>
    </div>
  </footer>

  <script>
    // Database dei 25 Prompt e Regole MIM
    const PROMPTS_DATA = [
      {
        id: 1,
        title: "Definire l'obiettivo di studio",
        cat: "strategia",
        description: "Chiarisci cosa vuoi imparare prima di iniziare ad usare l'IA.",
        prompt: "Sto studiando [MATERIA/ARGOMENTO].\n\nIl mio obiettivo è riuscire a [OBIETTIVO].\n\nIl mio livello è [CLASSE/LIVELLO].\n\nAiutami a trasformare questo obiettivo in 3-5 risultati concreti che dovrei essere in grado di raggiungere alla fine dello studio.\n\nNon svolgere il lavoro al posto mio.",
        fields: ["MATERIA/ARGOMENTO", "OBIETTIVO", "CLASSE/LIVELLO"]
      },
      {
        id: 2,
        title: "Chiedere una spiegazione (Tutor)",
        cat: "spiegazioni",
        description: "Usa l'IA per capire concetti complessi invece di chiedere una semplice definizione.",
        prompt: "Sono uno studente di [CLASSE/LIVELLO] e sto studiando [ARGOMENTO].\n\nNon ho capito bene [CONCETTO].\n\nSpiegamelo:\n1. con parole semplici;\n2. passo per passo;\n3. con un esempio concreto;\n4. indicando un errore tipico che potrei commettere.\n\nAlla fine fammi 3 domande per verificare se ho capito.\n\nNon darmi subito le risposte alle domande.",
        fields: ["CLASSE/LIVELLO", "ARGOMENTO", "CONCETTO"]
      },
      {
        id: 3,
        title: "Scomporre un problema",
        cat: "strategia",
        description: "Dividi un problema complesso in passaggi logici gestibili.",
        prompt: "Devo affrontare questo problema:\n\n[INCOLLA IL PROBLEMA]\n\nNon risolverlo direttamente.\n\nAiutami a scomporlo in passaggi logici.\n\nPer ogni passaggio indicami:\n- cosa devo capire;\n- quale domanda devo pormi;\n- quale informazione mi serve;\n- quale errore dovrei evitare.\n\nAspetta che provi io prima di mostrarmi il passaggio successivo.",
        fields: ["INCOLLA IL PROBLEMA"]
      },
      {
        id: 4,
        title: "Tutor socratico",
        cat: "spiegazioni",
        description: "Impara attraverso un dialogo a domande e risposte graduali.",
        prompt: "Agisci come un tutor di [MATERIA].\n\nDevo imparare [ARGOMENTO].\n\nFammi una domanda alla volta.\n\nNon darmi la soluzione prima che abbia provato a rispondere.\n\nDopo ogni mia risposta:\n1. dimmi cosa è corretto;\n2. individua eventuali errori;\n3. spiegami cosa devo migliorare;\n4. fammi una nuova domanda adeguata al mio livello.\n\nSe non so rispondere, dammi prima un piccolo indizio.",
        fields: ["MATERIA", "ARGOMENTO"]
      },
      {
        id: 5,
        title: "Allenarsi con gli esercizi",

    // Funzioni Utilità Clipboard e Toast
    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast("Prompt copiato negli appunti! 🚀");
      } catch (err) {
        showToast("Errore durante la copia.");
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    // Helper creazione elementi DOM
    function el(tag, className, html) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (html) e.innerHTML = html;
      return e;
    }

    // Router Vanilla SPA
    const routes = {
      'home': renderHome,
      'prompts': renderPrompts,
      'generator': renderGenerator,
      'semaforo': renderSemaforo,
      'dichiarazione': renderDichiarazione
    };

    function router() {
      const hash = location.hash.replace('#', '') || 'home';
      const renderFn = routes[hash] || renderHome;

      // Aggiorna navigazione
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.route === hash) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(renderFn());
      window.scrollTo(0, 0);
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);

        <button class="filter-btn ${currentCategory === 'esercitazione' ? 'active' : ''}" data-cat="esercitazione">🧪 Esercizi & Test</button>
        <button class="filter-btn ${currentCategory === 'verifica' ? 'active' : ''}" data-cat="verifica">🔎 Verifica & Fonti</button>
        <button class="filter-btn ${currentCategory === 'studio' ? 'active' : ''}" data-cat="studio">🗺️ Mappe & Studio</button>
        <button class="filter-btn ${currentCategory === 'privacy' ? 'active' : ''}" data-cat="privacy">🔐 Privacy & Regole</button>
      `);

      filterTags.addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) {
          filterTags.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentCategory = e.target.dataset.cat;
          updatePromptsGrid();
        }
      });

      filterSection.appendChild(filterTags);
      container.appendChild(filterSection);

      // Grid dei Prompt
      const grid = el('div', 'grid-2', '');
      grid.id = 'promptsGrid';
      container.appendChild(grid);

      function updatePromptsGrid() {
        grid.innerHTML = '';
        const filtered = PROMPTS_DATA.filter(p => {
          const matchCat = currentCategory === 'all' || p.cat === currentCategory;
          const matchSearch = p.title.toLowerCase().includes(searchQuery) || 
                              p.description.toLowerCase().includes(searchQuery) ||
                              p.prompt.toLowerCase().includes(searchQuery);
          return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #666;">Nessun prompt trovato per questa ricerca.</div>`;
          return;
        }

        filtered.forEach(item => {
          const card = el('div', 'prompt-card');
          card.innerHTML = `
            <div class="prompt-card-header">
              <div class="prompt-num">${item.id}</div>
              <div class="prompt-title">${item.title}</div>
            </div>
            <div class="prompt-card-body">
              <p style="font-size: 0.9rem; color: #4A4A68;">${item.description}</p>
              <div class="prompt-box">${item.prompt}</div>
              <div class="prompt-action-bar">
                <button class="btn btn-primary" style="flex:1;" onclick="copyToClipboard(\`${item.prompt.replace(/`/g, '\\`')}\`)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  Copia Prompt
                </button>
                ${item.fields.length > 0 ? `
                  <button class="btn btn-accent-yellow" onclick="openCustomizeModal(${item.id})">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Personalizza
                  </button>
                ` : ''}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      setTimeout(updatePromptsGrid, 0);

      return container;
    }

    // Modal di personalizzazione Prompt
    window.openCustomizeModal = function(id) {
      const item = PROMPTS_DATA.find(p => p.id === id);
      if (!item) return;

      const modal = document.getElementById('customModal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');

      title.innerText = `Personalizza: ${item.title}`;
      body.innerHTML = '';

      const form = el('form');
      form.addEventListener('submit', (e) => e.preventDefault());

      item.fields.forEach(field => {
        const group = el('div', 'form-group');
        group.innerHTML = `
          <label class="form-label">${field}</label>
          <input type="text" class="form-input modal-field-input" data-field="${field}" placeholder="Inserisci ${field.toLowerCase()}...">
        `;
        form.appendChild(group);
      });

      const previewBox = el('div', 'prompt-box');
      previewBox.style.marginTop = '1rem';
      previewBox.innerText = item.prompt;

      function updatePreview() {
        let text = item.prompt;
        form.querySelectorAll('.modal-field-input').forEach(input => {
          const f = input.dataset.field;
          const val = input.value.trim() || `[${f}]`;
          text = text.replaceAll(`[${f}]`, val);
        });
        previewBox.innerText = text;
      }

      form.addEventListener('input', updatePreview);

      const copyCustomBtn = el('button', 'btn btn-accent-teal', 'Copia Prompt Personalizzato');
      copyCustomBtn.style.marginTop = '1rem';
      copyCustomBtn.style.width = '100%';
      copyCustomBtn.onclick = () => {
        copyToClipboard(previewBox.innerText);
        modal.classList.remove('open');
      };

      body.appendChild(form);
      body.appendChild(previewBox);
      body.appendChild(copyCustomBtn);

      modal.classList.add('open');
    };

    document.getElementById('modalCloseBtn').onclick = () => {
      document.getElementById('customModal').classList.remove('open');
    };

    // 3. RENDER GENERATOR VIEW (Generatore di Prompt Universale - Regola 24)
    function renderGenerator() {
      const container = el('div', 'generator-view');

      const title = el('div', '', `
        <h2 class="section-title">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          Generatore del "Prompt Universale" per Studiare
        </h2>
        <p class="section-subtitle">Compila i tuoi dati di studio e genera automaticamente il prompt ideale conforme alle regole MIM.</p>
      `);
      container.appendChild(title);

      const layout = el('div', 'grid-2');

      const formCard = el('div', 'card');
      formCard.innerHTML = `
        <h3 style="font-size: 1.2rem; margin-bottom: 1rem; font-weight: 800; color: var(--color-primary);">1. I tuoi dati di studio</h3>
        <div class="form-group">
          <label class="form-label">Classe / Livello scolastico</label>
          <input type="text" id="genLivello" class="form-input" placeholder="es. Terza Superiore, 2° Media...">
        </div>
        <div class="form-group">
          <label class="form-label">Materia / Argomento</label>
          <input type="text" id="genMateria" class="form-input" placeholder="es. Fisica / Le Leggi di Keplero...">
        </div>
        <div class="form-group">
          <label class="form-label">Il tuo obiettivo principale</label>
          <input type="text" id="genObiettivo" class="form-input" placeholder="es. Capire le formule ed applicarle agli esercizi...">
        </div>
        <div class="form-group">
          <label class="form-label">Qual è la tua difficoltà principale?</label>
          <input type="text" id="genDifficolta" class="form-input" placeholder="es. Non riesco a ricordare i passaggi algebrici...">
        </div>
      `;

      const previewCard = el('div', 'card card-soft');
      previewCard.innerHTML = `
        <h3 style="font-size: 1.2rem; margin-bottom: 1rem; font-weight: 800; color: var(--color-hero);">2. Il tuo Prompt Pronto</h3>
        <div class="prompt-box" id="universalPromptPreview" style="min-height: 280px;">
          Caricamento in corso...
        </div>
        <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="genCopyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copia Prompt Universale
        </button>
      `;

      layout.appendChild(formCard);
      layout.appendChild(previewCard);
      container.appendChild(layout);

      function updateUniversalPrompt() {
        const livello = document.getElementById('genLivello').value.trim() || '[CLASSE/LIVELLO]';
        const materia = document.getElementById('genMateria').value.trim() || '[MATERIA/ARGOMENTO]';
        const obiettivo = document.getElementById('genObiettivo').value.trim() || '[OBIETTIVO]';
        const difficolta = document.getElementById('genDifficolta').value.trim() || '[DIFFICOLTÀ]';

        const promptText = `Sono uno studente di ${livello} e sto studiando ${materia}.

Il mio obiettivo è ${obiettivo}.

Mi trovo in difficoltà soprattutto su ${difficolta}.

Voglio usare l'IA come supporto allo studio, non per sostituire il mio lavoro.

Aiutami quindi a:
1. capire i concetti;
2. individuare eventuali lacune;
3. esercitarmi;
4. ricevere feedback;
5. verificare ciò che ho imparato.

Non darmi direttamente le risposte quando posso arrivarci ragionando.

Fammi domande, dammi suggerimenti progressivi e spiegami gli errori.

Segnala chiaramente le informazioni che dovrei verificare su fonti esterne.`;

        document.getElementById('universalPromptPreview').innerText = promptText;
      }

      setTimeout(() => {
        ['genLivello', 'genMateria', 'genObiettivo', 'genDifficolta'].forEach(id => {
          document.getElementById(id).addEventListener('input', updateUniversalPrompt);
        });
        document.getElementById('genCopyBtn').onclick = () => {
          copyToClipboard(document.getElementById('universalPromptPreview').innerText);
        };
        updateUniversalPrompt();
      }, 0);

      return container;
    }

    // 4. RENDER SEMAFORO VIEW
    function renderSemaforo() {
      const container = el('div', 'semaforo-view');

      const title = el('div', '', `
        <h2 class="section-title">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          Il Semaforo dell'IA Scolastica
        </h2>
        <p class="section-subtitle">Scopri subito cosa puoi fare liberamente, cosa devi controllare e cosa è severamente vietato.</p>
      `);
      container.appendChild(title);

      const semaforoGrid = el('div', 'grid-3');

      // Verde
      const verde = el('div', 'card', `
        <div style="margin-bottom: 1rem;">
          <span class="semaforo-badge semaforo-verde">🟢 VERDE — Falla lavorare con te</span>
        </div>
        <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.8rem; font-size: 0.95rem;">
          <li>📚 <strong>Spiegazioni:</strong> "Spiegami questo concetto e poi interrogami."</li>
          <li>🧠 <strong>Esempi:</strong> "Fammi un esempio e poi chiedimi di crearne uno io."</li>
          <li>🔍 <strong>Feedback:</strong> "Individua i punti deboli della mia risposta."</li>
          <li>🧩 <strong>Problem Solving:</strong> "Aiutami a trovare il primo passaggio."</li>
          <li>📝 <strong>Revisione:</strong> "Non riscrivere: indicami cosa devo migliorare."</li>
        </ul>
      `);

      // Giallo
      const giallo = el('div', 'card', `
        <div style="margin-bottom: 1rem;">
          <span class="semaforo-badge semaforo-giallo">🟡 GIALLO — Controlla sempre</span>
        </div>
        <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.8rem; font-size: 0.95rem;">
          <li>🌐 <strong>Fatti e Date:</strong> Verificali con fonti esterne affidabili.</li>
          <li>📝 <strong>Riassunti:</strong> Verifica che l'IA non abbia inventato dettagli.</li>
          <li>📚 <strong>Citazioni:</strong> Controlla sempre la fonte originale.</li>
          <li>✍️ <strong>Correzione:</strong> Chiedi di spiegare l'errore prima di applicare la correzione.</li>
        </ul>
      `);

      // Rosso
      const rosso = el('div', 'card', `
        <div style="margin-bottom: 1rem;">
          <span class="semaforo-badge semaforo-rosso">🔴 ROSSO — Non far fare il tuo lavoro</span>
        </div>
        <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.8rem; font-size: 0.95rem;">
          <li>❌ <strong>Compito intero:</strong> "Fai il compito completo."</li>
          <li>❌ <strong>Relazione pronta:</strong> "Scrivi un testo che posso consegnare."</li>
          <li>❌ <strong>Copiare soluzioni:</strong> "Rispondi senza spiegazioni."</li>
          <li>❌ <strong>Inganno:</strong> "Fammi sembrare che l'abbia scritto io."</li>
        </ul>
      `);

      semaforoGrid.appendChild(verde);
      semaforoGrid.appendChild(giallo);
      semaforoGrid.appendChild(rosso);
      container.appendChild(semaforoGrid);

      return container;
    }

    // 5. RENDER DICHIARAZIONE VIEW (Tool Regola 22)
    function renderDichiarazione() {
      const container = el('div', 'dichiarazione-view');

      const title = el('div', '', `
        <h2 class="section-title">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Registro per la Trasparenza dell'Uso dell'IA
        </h2>
        <p class="section-subtitle">Compila questo modulo ogni volta che usi l'IA per un compito, per consegnarlo o mostrarlo al docente (Regola 22).</p>
      `);
      container.appendChild(title);

      const layout = el('div', 'grid-2');

      const form = el('div', 'card');
      form.innerHTML = `
        <h3 style="font-size: 1.2rem; margin-bottom: 1rem; font-weight: 800; color: var(--color-primary);">Modulo di Dichiarazione</h3>
        <div class="form-group">
          <label class="form-label">Data</label>
          <input type="date" id="logData" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Strumento IA Usato</label>
          <input type="text" id="logStrumento" class="form-input" placeholder="es. ChatGPT, Claude, Gemini...">
        </div>
        <div class="form-group">
          <label class="form-label">Per cosa l'hai usato?</label>
          <input type="text" id="logAttivita" class="form-input" placeholder="es. Generare una scaletta per la ricerca di storia...">
        </div>
        <div class="form-group">
          <label class="form-label">Cosa hai fatto tu personalmente?</label>
          <textarea id="logPersonale" class="form-textarea" rows="2" placeholder="es. Ho letto 3 articoli di enciclopedia e scritto la bozza finale..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Cosa hai verificato su fonti esterne?</label>
          <textarea id="logVerifica" class="form-textarea" rows="2" placeholder="es. Ho verificato le date storiche sul libro di testo..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Cosa hai modificato rispetto all'output IA?</label>
          <textarea id="logModificato" class="form-textarea" rows="2" placeholder="es. Ho riscritto l'introduzione e corretto 2 errori..."></textarea>
        </div>
      `;

      const preview = el('div', 'card card-soft');
      preview.innerHTML = `
        <h3 style="font-size: 1.2rem; margin-bottom: 1rem; font-weight: 800; color: var(--color-hero);">Scontrino di Trasparenza</h3>
        <div class="prompt-box" id="logPreviewText" style="min-height: 260px;"></div>
        <button class="btn btn-accent-teal" style="width: 100%; margin-top: 1rem;" id="logCopyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copia Dichiarazione per il Docente
        </button>
      `;

      layout.appendChild(form);
      layout.appendChild(preview);
      container.appendChild(layout);

      function updateLogText() {
        const d = document.getElementById('logData').value || new Date().toISOString().split('T')[0];
        const s = document.getElementById('logStrumento').value.trim() || '[STRUMENTO]';
        const a = document.getElementById('logAttivita').value.trim() || '[ATTIVITÀ]';
        const p = document.getElementById('logPersonale').value.trim() || '[ATTIVITÀ SVOLTE PERSONALMENTE]';
        const v = document.getElementById('logVerifica').value.trim() || '[FONTI / CONTROLLI]';
        const m = document.getElementById('logModificato').value.trim() || '[MODIFICHE]';

        const text = `📅 DATA:
${d}

🤖 STRUMENTO:
${s}

🎯 PER COSA L'HO USATO:
${a}

🧠 COSA HO FATTO IO:
${p}

🔎 COSA HO VERIFICATO:
${v}

✍️ COSA HO MODIFICATO:
${m}`;

        document.getElementById('logPreviewText').innerText = text;
      }

      setTimeout(() => {
        document.getElementById('logData').valueAsDate = new Date();
        ['logData', 'logStrumento', 'logAttivita', 'logPersonale', 'logVerifica', 'logModificato'].forEach(id => {
          document.getElementById(id).addEventListener('input', updateLogText);
        });
        document.getElementById('logCopyBtn').onclick = () => {
          copyToClipboard(document.getElementById('logPreviewText').innerText);
        };
        updateLogText();
      }, 0);

      return container;
    }
  </script>
