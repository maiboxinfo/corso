<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cruscotto Metodologico PROMPT-D</title>
  <style>
    /* DESIGN TOKENS (No #000000 allowed) */
    :root {
      /* Colori primari */
      --color-hero: #0E47CB;
      --color-outline: #1A1A4E;
      --color-primary: #2F54EB;

      /* Accenti */
      --color-accent-yellow: #F5A623;
      --color-accent-teal: #3DD9C5;
      --color-accent-coral: #E84545;

      /* Sfondi */
      --color-bg: #FFFFFF;
      --color-bg-soft: #F4F5F7;

      /* Testo */
      --color-text: #1A1A2E; /* Sostituto per il nero */

      /* Geometrie e Tratti */
      --shadow-flat: 4px 4px 0 rgba(26, 26, 78, 0.15); /* Ombra piatta, no blur */
      --shadow-flat-solid: 4px 4px 0 var(--color-outline);
      --stroke-width: 2.5px;
      --radius-base: 12px;
    }

    /* RESET & BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--color-text);
      background-color: var(--color-bg);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* LAYOUT APP */
    .app-layout {
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .app-layout {
        flex-direction: row;
      }
    }

    /* HEADER & SIDEBAR */
    .app-sidebar {
      background: var(--color-bg);
      border-bottom: var(--stroke-width) solid var(--color-outline);
      padding: 1.5rem;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .app-sidebar {
        width: 280px;
        border-bottom: none;
        border-right: var(--stroke-width) solid var(--color-outline);
        height: 100vh;
        position: sticky;
        top: 0;
        overflow-y: auto;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-hero);
      margin-bottom: 2rem;
    }

    .nav-menu {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @media (min-width: 1024px) {
      .nav-menu {
        flex-direction: column;
      }
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 1rem;
      color: var(--color-text);
      text-decoration: none;
      font-weight: 700;
      border: var(--stroke-width) solid transparent;
      border-radius: var(--radius-base);
      transition: all 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      background: var(--color-bg-soft);
      border-color: var(--color-outline);
      box-shadow: 2px 2px 0 var(--color-outline);
      transform: translate(-2px, -2px);
    }

    .nav-link svg {
      width: 24px;
      height: 24px;
      stroke: var(--color-outline);
      stroke-width: var(--stroke-width);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* MAIN CONTENT */
    .app-main {
      flex: 1;
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    /* COMPONENTS */
    .card {
      background: var(--color-bg-soft);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      box-shadow: var(--shadow-flat);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title .badge {
      background: var(--color-accent-yellow);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* FORMS */
    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 1rem;
      color: var(--color-text);
      background: var(--color-bg);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: calc(var(--radius-base) / 2);
      box-shadow: 2px 2px 0 rgba(26,26,78,0.1);
      transition: all 0.2s;
    }

    .form-control:focus {
      outline: none;
      box-shadow: 4px 4px 0 var(--color-accent-teal);
      border-color: var(--color-outline);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: calc(var(--radius-base) / 2);
      padding: 0.75rem 1.5rem;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: var(--shadow-flat-solid);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn:hover, .btn:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--color-outline);
      outline: none;
    }

    .btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0 var(--color-outline);
    }

    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-hero { background: var(--color-hero); color: #fff; }
    .btn-accent-yellow { background: var(--color-accent-yellow); color: var(--color-outline); }
    .btn-accent-teal { background: var(--color-accent-teal); color: var(--color-outline); }
    .btn-outline { background: var(--color-bg); color: var(--color-text); }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }

    /* BLOOM PYRAMID INTERACTIVE */
    .bloom-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      margin: 2rem 0;
    }
    
    .bloom-level {
      border: var(--stroke-width) solid var(--color-outline);
      padding: 0.5rem 1rem;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
      background: var(--color-bg);
      user-select: none;
      position: relative;
    }
    .bloom-level:hover { transform: scale(1.02); }
    
    .bloom-l6 { width: 40%; background: var(--color-accent-coral); color: white; border-radius: 8px 8px 0 0; }
    .bloom-l5 { width: 55%; background: var(--color-accent-yellow); color: var(--color-outline); }
    .bloom-l4 { width: 70%; background: var(--color-accent-teal); color: var(--color-outline); }
    .bloom-l3 { width: 85%; background: var(--color-hero); color: white; }
    .bloom-l2 { width: 95%; background: var(--color-primary); color: white; }
    .bloom-l1 { width: 100%; background: var(--color-bg-soft); color: var(--color-text); border-radius: 0 0 8px 8px; }

    .bloom-details {
      background: var(--color-bg);
      border: var(--stroke-width) dashed var(--color-outline);
      padding: 1rem;
      border-radius: var(--radius-base);
      margin-top: 1rem;
      display: none;
    }

    .verb-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    
    .verb-tag {
      background: var(--color-bg-soft);
      border: 2px solid var(--color-outline);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .verb-tag:hover { background: var(--color-accent-teal); }

    /* ALERT BANNERS */
    .alert {
      padding: 1rem;
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 15px;
      align-items: flex-start;
      box-shadow: var(--shadow-flat);
    }
    .alert-warning { background: #FFF3CD; }
    .alert-error { background: #F8D7DA; }
    .alert-info { background: #D1ECF1; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(26, 26, 78, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--color-bg);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 8px 8px 0 var(--color-outline);
      transform: translateY(20px);
      transition: transform 0.2s;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    /* ILLUSTRATION */
    .hero-illustration {
      width: 100%;
      max-width: 300px;
      height: auto;
      margin: 0 auto 2rem auto;
      display: block;
    }

    /* OUTPUT BOX */
    .output-box {
      background: #fdfdfd;
      border: var(--stroke-width) solid var(--color-outline);
      padding: 1.5rem;
      border-radius: var(--radius-base);
      font-family: 'Courier New', Courier, monospace;
      font-weight: 600;
      white-space: pre-wrap;
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    
    /* ESEMPI GRID */
    .esempi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .esempio-card {
      background: var(--color-bg);
      border: var(--stroke-width) solid var(--color-outline);
      border-radius: var(--radius-base);
      padding: 1.5rem;
      box-shadow: var(--shadow-flat);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .esempio-materia {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 12px;
      border: 2px solid var(--color-outline);
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    /* UTILITIES */
    .d-none { display: none !important; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .mt-2 { margin-top: 1rem; }
    .text-center { text-align: center; }
  </style>
</head>

      return sensitiveRegex.test(text);
    };

    function generatePrompt() {
      // Validazione base

        return;

      // Check GDPR nel parametro

        showModal(
          "Filtro GDPR: Dati Sensibili Rilevati", 
          "Hai inserito termini potenzialmente sensibili (es. BES, DSA, o nomi propri). <b>È severamente vietato immettere dati personali di studenti in LLM cloud esterni.</b><br><br>Modifica il testo usando astrazioni (es. 'alunno con necessità di sintassi semplificata e font leggibile' invece di 'Mario con DSA').",
          true
        );
        return;
      }

      let prompt = `Agisci come un ${promptState.profilo}.\n\n`;
      prompt += `Il tuo compito è produrre il seguente documento: ${promptState.risultato}.\n\n`;
      prompt += `[OBIETTIVO COGNITIVO]: Il verbo d'azione principale dell'attività deve essere "${promptState.verb}".\n`;
      if(promptState.evidenza) prompt += `[PROVA DI EVIDENZA]: Assicurati che l'attività culminerà in questa dimostrazione da parte degli studenti: "${promptState.evidenza}". Struttura il lavoro a ritroso (Backward Design) per garantire questo risultato.\n\n`;
      if(promptState.materiali) prompt += `[ANCORAGGIO MATERIALI]: Basati ESCLUSIVAMENTE sui seguenti materiali normativi/testuali. Non inventare dati o procedure: """${promptState.materiali}"""\n\n`;
      if(promptState.parametri) prompt += `[VINCOLI DI CONTESTO]: L'attività deve essere progettata rispettando rigorosamente queste condizioni (tempo, numero studenti, accessibilità): ${promptState.parametri}.\n\n`;
      if(promptState.formato) prompt += `[FORMATTAZIONE]: ${promptState.formato}.\n\n`;
      if(promptState.diagnosi) prompt += `[DIAGNOSI OBBLIGATORIA]: Alla fine del tuo output, aggiungi una sezione intitolata 'Autocritica'. In essa, verifica passo-passo se i tempi sommati delle attività coincidono con il tempo totale a disposizione e se le norme di sicurezza di base (se in laboratorio) sono state rispettate nella traccia.`;

      document.getElementById('final-prompt-text').innerText = prompt;
      document.getElementById('output-container').classList.remove('d-none');
      
      // Scroll to output
      document.getElementById('output-container').scrollIntoView({ behavior: 'smooth' });

      `;
      return wrapper;
    }

    function renderEsempi() {
      const wrapper = e('div');
      wrapper.innerHTML = `
        <h2 class="mb-2" style="color:var(--color-hero);">Esempi Pronti (Templates)</h2>
        <p class="mb-2">Seleziona un esempio preimpostato. Verrà caricato nel Costruttore (Wizard) dove potrai personalizzarlo prima di generare il prompt.</p>
        <div class="esempi-grid" id="esempi-grid-container"></div>
      `;
      
      const grid = wrapper.querySelector('#esempi-grid-container');
      
      esempiData.forEach(es => {
        const card = e('div', 'esempio-card');
        // Usa colore specifico della materia come bordo superiore
        card.style.borderTop = `6px solid ${es.colore}`;
        
        card.innerHTML = `
          <div>
            <span class="esempio-materia" style="color:var(--color-outline); background-color:${es.colore}20; border-color:${es.colore};">${es.materia}</span>
            <h3 style="margin-bottom:0.5rem; font-size:1.1rem; font-weight:800;">${es.titolo}</h3>
            <p style="font-size:0.85rem; font-weight:600; margin-bottom:1rem;"><strong>Obiettivo:</strong> ${es.verb}</p>
          </div>
          <button class="btn btn-outline btn-sm" onclick="loadExample(${es.id})">Carica e Modifica</button>
        `;
        grid.appendChild(card);
      });

      return wrapper;
    }

    function loadExample(id) {
      const esempio = esempiData.find(e => e.id === id);
      if(esempio) {
        // Popola lo stato globale del wizard con i dati dell'esempio
        promptState = { ...esempio.state };
        // Cambia rotta al wizard (renderWizard si occuperà di iniettare promptState nei campi)
        location.hash = '#/wizard';
      }
    }

    // Helper sostitutivo di alert per simulazioni UI minori
    function alertSim(msg) {
      showModal("Prompt Generato (Simulazione)", msg);
    }
  </script>
</body>
</html>
